const state={session:null,page:"contractors",selectedContractor:null,contractors:[],customers:[],pos:[],vehicles:[],loads:[],itcs:[],itcWeighments:[],stats:{},editLoad:null,selectedLoad:null,documents:null,ewayFiles:{}};
const $=id=>document.getElementById(id); const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=v=>Number(v||0); const fmt=v=>Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3}); const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function isoToday(){return new Date().toISOString().slice(0,10)}
function fmtDate(v){if(!v)return "";const s=String(v).slice(0,10);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:s}
function active(){return state.selectedContractor}
function contractorContext(){const c=active();return c?`<div class="context">Active Contractor: <b>${esc(c.contractor_name||"")}</b></div>`:""}
// Form drafts use localStorage so an unfinished entry survives navigation, tab/app switching,
// browser re-render and normal refresh. Explicit Cancel/Save clears the draft.
function saveForm(key,obj){try{localStorage.setItem("wm360:draft:"+key,JSON.stringify({savedAt:Date.now(),data:obj}))}catch{} }
function loadForm(key){try{const raw=localStorage.getItem("wm360:draft:"+key);if(!raw)return null;const o=JSON.parse(raw);return o?.data||o}catch{return null}}
function clearForm(key){try{localStorage.removeItem("wm360:draft:"+key)}catch{}}
function formSnapshot(prefix){const ids=["date","vehicle","driver","gross","tare","po","material","eway","wood","handling","amc","freight","advance","advanceBy","advanceOther"];const o={};ids.forEach(k=>{const e=$(prefix+k);if(e)o[k]=e.value});return o}
function restoreSnapshot(prefix,s){if(!s)return;Object.entries(s).forEach(([k,v])=>{const e=$(prefix+k);if(e&&v!=null)e.value=v});}
function navButton(p,label,icon){const activePage=state.page===p||(p==='freight'&&state.page==='freightdetail');return `<button class="${activePage?'active':''}" onclick="go('${p}')">${icon||''} ${label}</button>`}
function shell(body){return `<header><div class="brand">🌲 WoodMaster</div><div class="user">${esc(state.session?.user?.email||"")}${active()?` | ${esc(active().contractor_name)}`:""}</div></header><div class="layout"><nav>${navButton('dashboard','Dashboard','🏠')}${navButton('loads','Loads','🚚')}${navButton('newload','New Load','＋')}${navButton('masters','Masters','⚙')}${active()?navButton('itc','Final Weighments','⚖'):''}${active()?navButton('documents','Documents','📄'):''}${active()?(state.page==='freight'||state.page==='freightdetail'?navButton('freight','Final Freight Letters','₹'):navButton('freight','Final Freight Letters','₹')):''}${active()?navButton('billing','Material Billing','🧾'):''}${active()?navButton('amc','AMC','🧮'):''}${navButton('contractors','Contractors','⇄')}<button onclick="logout()">↪ Sign out</button></nav><main>${body}</main></div>`}
async function refreshAll(){await refreshContractors();if(active())await refreshMasters();if(active())await refreshLoads();}
async function refreshContractors(){const r=await sb.from('contractor_master').select('*').eq('is_active',true).order('contractor_name');if(r.error)throw r.error;state.contractors=r.data||[]}
async function refreshMasters(){const [c,p,v,i]=await Promise.all([sb.from('customer_master').select('*').eq('is_active',true).order('customer_name'),sb.from('po_master').select('*,customer_master(customer_name,gstin)').eq('is_active',true).order('po_number'),sb.from('vehicle_master').select('*').eq('is_active',true).order('vehicle_number'),sb.from('itc_master').select('*').eq('is_active',true).order('company_name')]);if(c.error)throw c.error;if(p.error)throw p.error;if(v.error)throw v.error;if(i.error)throw i.error;state.customers=c.data||[];state.pos=(p.data||[]).filter(x=>!active()||x.contractor_id===active().id);state.vehicles=v.data||[];state.itcs=i.data||[]}
async function refreshLoads(){if(!active()){state.loads=[];return}const r=await sb.from('loads').select('*,vehicle_master(vehicle_number,owner_name,driver_name,current_tare),po_master(po_number,contractor_id,area_name,species_name,wood_rate,handling_other_rate,amc_rate,hsn_code,customer_id,customer_master(customer_name,gstin))').order('load_date',{ascending:false}).order('load_number',{ascending:false}).limit(500);if(r.error)throw r.error;state.loads=(r.data||[]).filter(x=>x.po_master?.contractor_id===active().id||!x.po_master?.contractor_id)}
async function nextDc(){const now=new Date();const fy=(now.getMonth()+1)>=4?`${now.getFullYear()}-${String(now.getFullYear()+1).slice(-2)}`:`${now.getFullYear()-1}-${String(now.getFullYear()).slice(-2)}`;let max=0;const r=await sb.from('loads').select('dc_number').not('dc_number','is',null).limit(5000);if(!r.error)(r.data||[]).forEach(x=>{const parts=String(x.dc_number||'').split('/');if(parts.length===2&&parts[1]===fy)max=Math.max(max,Number(parts[0])||0)});return `${String(max+1).padStart(2,'0')}/${fy}`}
function poLabel(p){const area=String(p.area_name||'').trim().replace(/\s+/g,'_');const mat=String(p.species_name||'').trim().replace(/[^A-Za-z0-9]+/g,'');const cust=String(p.customer_master?.customer_name||'').trim().replace(/[^A-Za-z0-9]+/g,'');return `${p.po_number}_${area}_${mat.slice(0,3).toUpperCase()}_${cust.slice(0,3).toUpperCase()}`}
function dashboard(){const loads=state.loads||[];return `<div class="context">Active Contractor: <b>${esc(active()?.contractor_name)}</b> · ${esc(active()?.contractor_code||'')}</div><div class="topbar"><div><h1>${esc(active()?.contractor_name||'Contractor')}</h1><div class="sub">Contractor dashboard — all operational records below belong to the selected contractor.</div></div><button class="btn secondary" onclick="changeContractor()">⇄ Change Contractor</button></div><div class="grid"><div class="card"><div class="label">Loads</div><div class="metric">${loads.length}</div></div><div class="card"><div class="label">Network Net MT</div><div class="metric">${fmt(loads.reduce((a,x)=>a+num(x.network_net),0))}</div></div><div class="card"><div class="label">Open / Pending Loads</div><div class="metric">${loads.filter(x=>!['Billed','Exception'].includes(x.status)).length}</div></div><div class="card"><div class="label">Active POs</div><div class="metric">${state.pos.length}</div></div></div><div class="section"><h2>Quick Actions</h2><div class="quick"><button onclick="go('newload')"><b>＋ New Load</b><span class="small">Start from the network weighbridge slip.</span></button><button onclick="go('loads')"><b>🚚 Loads</b><span class="small">View, edit and generate documents.</span></button><button onclick="go('masters')"><b>⚙ Masters</b><span class="small">Customers and POs for this contractor.</span></button><button onclick="go('itc')"><b>⚖ Final Weighment</b><span class="small">Enter and verify ITC card data.</span></button></div></div><div class="section"><h2>Recent Loads</h2>${loadTable(loads.slice(0,10))}</div>`}
function loadTable(loads){if(!loads.length)return `<div class="card empty">No loads for this contractor.</div>`;return `<div class="tablewrap"><table><thead><tr><th>DC Number</th><th>Serial</th><th>Date</th><th>Vehicle</th><th>Net MT</th><th>Freight Rate</th><th>Advance</th><th>E-way</th><th>Status</th><th>Documents</th></tr></thead><tbody>${loads.map((x,i)=>{const docAction=x.status==='Load Created'?`<button class="btn primary mini" onclick="openDocsModal('${x.id}')">Generate Documents</button>`:`<button class="btn secondary mini" onclick="viewDocuments('${x.id}')">View Documents</button>`;return `<tr><td><button class="btn secondary mini" onclick="loadDetails('${x.id}')">${esc(x.dc_number||'—')}</button></td><td>${i+1}</td><td>${fmtDate(x.load_date)}</td><td>${esc(x.vehicle_master?.vehicle_number||'')}</td><td>${fmt(x.network_net)}</td><td>${money(x.freight_rate)}</td><td>${money(x.advance)}</td><td>${esc(x.eway_bill_no||'')}</td><td><span class="badge">${esc(x.status||'')}</span></td><td>${docAction}</td></tr>`}).join('')}</tbody></table></div>`}
function loadDetails(id){state.selectedLoad=state.loads.find(x=>x.id===id)||null;state.page='loaddetail';render()}

async function extractEway(e){const f=e.target.files?.[0];if(!f)return; state.ewayFiles.__new=f;const s=$("ewayStatus");s.textContent=`Selected: ${f.name}. Attempting extraction…`;try{let text='';if(f.type==='application/pdf'){const pdf=await pdfjsFromFile(f);for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();text+=' '+tc.items.map(x=>x.str).join(' ')}}else{ text=''; }

 const x=state.loads.find(v=>v.id===id); if(!x)return;

function getItcDrafts(){try{return JSON.parse(localStorage.getItem('wm360:draft:itcDrafts')||'{}')}catch(e){return {}}}

function saveItcDraft(){const loadId=state.selectedLoad?.id||$('itcLoad')?.value;if(!loadId)return;const d=getItcDrafts();d[loadId]={wc:(($('wc')?.value||'').toUpperCase()),wcDate:$('wcDate')?.value||'',vehicle:(($('itcVehicle')?.value||'').toUpperCase()),gross:$('itcGross')?.value||'',tare:$('itcTare')?.value||'',net:$('itcNet')?.value||'',approved:$('itcApproved')?.value||'',approvedAuto:$('itcApproved')?.dataset.auto!=='0',savedAt:Date.now()};localStorage.setItem('wm360:draft:itcDrafts',JSON.stringify(d))}

function clearItcDraft(loadId){const d=getItcDrafts();delete d[loadId];localStorage.setItem('wm360:draft:itcDrafts',JSON.stringify(d))}

function clearAllItcDrafts(){localStorage.removeItem('wm360:draft:itcDrafts')}

function calcItcNet(){const g=$('itcGross'),t=$('itcTare'),n=$('itcNet'),a=$('itcApproved');if(!g||!t||!n||!a)return;const gv=g.value===''?null:num(g.value),tv=t.value===''?null:num(t.value);if(gv===null||tv===null){n.value='';if(a.dataset.auto!=='0')a.value='';saveItcDraft();return}const net=gv-tv;n.value=net.toFixed(3);if(a.dataset.auto!=='0'||a.value===''){a.value=net.toFixed(3);a.dataset.auto='1'}saveItcDraft()}

function bindItcForm(){const ids=['wc','wcDate','itcVehicle','itcGross','itcTare','itcNet','itcApproved'];ids.forEach(id=>{const el=$(id);if(!el)return;el.addEventListener('input',()=>{if(id==='itcVehicle')el.value=el.value.toUpperCase();if(id==='itcApproved')el.dataset.auto='0';if(id==='itcGross'||id==='itcTare')calcItcNet();else saveItcDraft()});el.addEventListener('change',()=>{if(id==='itcVehicle')el.value=el.value.toUpperCase();if(id==='itcApproved')el.dataset.auto='0';saveItcDraft()})});calcItcNet();saveItcDraft()}

const wc=$('wc').value.trim().toUpperCase(); $('wc').value=wc; const wcDate=$('wcDate').value, approved=$('itcApproved').value;
if(!wc||!wcDate||!approved)return alert('WC Number, WC Date and Approved Weight are required.');
const fields=[
['WC Number','',wc,'text'],
['WC Date','',wcDate,'date'],
['Vehicle Number',x.vehicle_master?.vehicle_number||'', $('itcVehicle').value,'text'],
['DC Number',x.dc_number||'', $('itcDc').value,'text'],
['Material',x.species_name||x.po_master?.species_name||'', $('itcMaterial').value,'text'],
['Gross Weight',fmt(x.network_gross),$('itcGross').value,'number'],
['Tare Weight',fmt(x.network_tare),$('itcTare').value,'number'],
['Net Weight',fmt(x.network_net),$('itcNet').value,'number'],
['Approved Weight','',approved,'number']
];
const body=`<div class="compare"><div class="head">WoodMaster existing data</div><div class="head">ITC card / user verified data</div>${fields.map(([n,a,b,type])=>{
const hasExisting=a!=='';
const diff=hasExisting&&String(a)!==String(b);
const id='cmp_'+n.replace(/\\W/g,'_');
const readonly=n==='Net Weight';
const extra=n==='WC Number'||n==='Vehicle Number'?'oninput="this.value=this.value.toUpperCase()"':'';
return `<div><b>${esc(n)}</b><br>${hasExisting?esc(a):'<span class="small">Entered by user</span>'}</div><div class="${diff?'diff':''}"><b>${esc(n)}</b><br><input id="${id}" data-cmp="${esc(n)}" type="${type}" value="${esc(b)}" ${type==='number'?'step="0.001"':''} ${extra} ${readonly?'readonly class="readonly"':''} style="width:100%;padding:8px;border:1px solid #d0d5dd;border-radius:7px"></div>`;
}).join('')}</div><div class="notice" style="margin-top:14px">Review the complete comparison before saving. WC Number, WC Date and Approved Weight come directly from your first Final Weighment screen entry; you do not need to type them again. Differences from WoodMaster data are highlighted. You may correct any value here before confirming.</div>`;

async function saveComparedItc(loadId){
  const x=state.loads.find(v=>v.id===loadId)||state.selectedLoad;
  if(!x)return alert('Load/DC context is missing. Please close this window, select the DC again, and retry.');
  const modal=document.getElementById('wmModal');
  const cmp=(name)=>modal?.querySelector('[data-cmp="'+name.replace(/"/g,'\\"')+'"]');
  const wcEl=cmp('WC Number'),dateEl=cmp('WC Date'),apEl=cmp('Approved Weight');
  if(!modal||!wcEl||!dateEl||!apEl)return alert('The comparison data could not be read. Please close the comparison and try again.');
  const wc=wcEl.value.trim().toUpperCase(),d=dateEl.value,ap=num(apEl.value); wcEl.value=wc;
  if(!wc||!d||ap<=0)return alert('WC Number, WC Date and Approved Weight are required.');
  const g=num(cmp('Gross Weight')?.value),t=num(cmp('Tare Weight')?.value);
  if(g<0||t<0||g<t)return alert('Please verify Gross and Tare Weight. Gross Weight cannot be less than Tare Weight.');
  const n=Number((g-t).toFixed(3));
  const netEl=cmp('Net Weight'); if(netEl)netEl.value=n.toFixed(3);
  const vehicle=cmp('Vehicle Number')?.value.trim().toUpperCase()||'';
  const material=cmp('Material')?.value.trim()||'';
  const dc=cmp('DC Number')?.value.trim()||x.dc_number||'';
  const row={load_id:loadId,wc_number:wc,wc_date:d,vehicle_number:vehicle,dc_number:dc,dc_date:x.load_date,material_description:material,gross_weight:g,tare_weight:t,net_weight:n,approved_weight:ap,ocr_verified:true,source:'Manual',created_by:state.session?.user?.id||null};
  const saveBtn=document.querySelector('#wmModal .actions .primary:last-of-type, #wmModal .actions .primary');
  if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Saving…';}
  try{
    // Update an existing ITC record for this load; otherwise insert a new one.
    // This avoids ambiguous upsert behavior when WC Number is globally unique.
    const existing=await sb.from('itc_weighments').select('id').eq('load_id',loadId).maybeSingle();
    if(existing.error)throw existing.error;
    let r;
    if(existing.data){
      r=await sb.from('itc_weighments').update(row).eq('id',existing.data.id).select().single();
    }else{
      r=await sb.from('itc_weighments').insert(row).select().single();
    }
    if(r.error){
      if(String(r.error.message||'').toLowerCase().includes('duplicate')||String(r.error.message||'').toLowerCase().includes('unique')){
        throw new Error(`WC Number '${wc}' already exists for another load. Please verify the WC Number before saving.`);
      }
      throw r.error;
    }
    const sr=await sb.from('loads').update({status:'ITC Weighment Received'}).eq('id',loadId);
    if(sr.error)throw sr.error;
    if(vehicle){
      let v=state.vehicles.find(z=>z.vehicle_number.toUpperCase()===vehicle);
      if(v){
        const vr=await sb.from('vehicle_master').update({current_tare:t,last_itc_tare_date:d}).eq('id',v.id);
        if(vr.error)throw vr.error;
      }
    }
    clearItcDraft(loadId);
    closeModal();
    state.selectedLoad=state.loads.find(v=>v.id===loadId)||x;
    alert('Final Weighment saved successfully.');
    await refreshLoads();
    state.selectedLoad=state.loads.find(v=>v.id===loadId)||null;
    state.page='itc';
    await render();
  }catch(err){
    console.error('ITC save failed',err);
    alert('Final Weighment was not saved.\n\n'+(err?.message||String(err)));
    if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Confirm & Save Final Weighment';}
  }
}

function numberWordsIndian(n){
 const ones=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 function under1000(x){let a=[];if(x>=100){a.push(ones[Math.floor(x/100)]+' Hundred');x%=100;if(x)a.push('and')}if(x>=20){a.push(tens[Math.floor(x/10)]);if(x%10)a[a.length-1]+='-'+ones[x%10]}else if(x>0)a.push(ones[x]);return a.join(' ')}
 n=Math.max(0,Math.round(Number(n)||0));if(n===0)return 'Zero Rupees Only';let parts=[];const crore=Math.floor(n/10000000);n%=10000000;const lakh=Math.floor(n/100000);n%=100000;const thousand=Math.floor(n/1000);n%=1000;if(crore)parts.push(under1000(crore)+' Crore');if(lakh)parts.push(under1000(lakh)+' Lakh');if(thousand)parts.push(under1000(thousand)+' Thousand');if(n)parts.push(under1000(n));return parts.join(' ')+' Rupees Only';
}

async function getMaterialInvoiceStates(loadIds){
  const ids=[...new Set((loadIds||[]).filter(Boolean).map(String))];
  if(!ids.length)return {items:[],liveItems:[],liveByLoad:new Map(),allByLoad:new Map()};
  const ir=await sb.from('invoice_items').select('id,load_id,invoice_id,is_active').in('load_id',ids);
  if(ir.error)throw ir.error;
  const raw=ir.data||[];
  const invoiceIds=[...new Set(raw.map(x=>x.invoice_id).filter(Boolean))];
  let headers=[];
  if(invoiceIds.length){
    const hr=await sb.from('material_invoices').select('id,invoice_number,status,invoice_date,from_date,to_date').in('id',invoiceIds);
    if(hr.error)throw hr.error;
    headers=hr.data||[];
  }
  const hmap=new Map(headers.map(h=>[String(h.id),h]));
  const items=raw.map(x=>({...x,material_invoices:hmap.get(String(x.invoice_id))||null}));
  const liveStatuses=new Set(['draft','verified','finalized']);
  const liveItems=items.filter(x=>{
    const st=String(x.material_invoices?.status||'').trim().toLowerCase();
    return x.is_active!==false && liveStatuses.has(st);
  });
  const liveByLoad=new Map();
  for(const x of liveItems){
    const key=String(x.load_id);
    const old=liveByLoad.get(key);
    // Any Finalized invoice is authoritative as Billed; otherwise keep a live Draft/Verified reservation.
    const st=String(x.material_invoices?.status||'').trim().toLowerCase();
    if(!old || st==='finalized' || String(old.material_invoices?.status||'').toLowerCase()!=='finalized') liveByLoad.set(key,x);
  }
  const allByLoad=new Map();
  for(const x of items){
    const key=String(x.load_id);
    const old=allByLoad.get(key);
    if(!old || new Date(x.material_invoices?.invoice_date||0)>new Date(old.material_invoices?.invoice_date||0)) allByLoad.set(key,x);
  }
  return {items,liveItems,liveByLoad,allByLoad};
}

function parseWoodReceiptSummary(text){const t=String(text||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();const unique=(t.match(/Unique\s*No\s*:\s*([A-Za-z0-9]+)/i)||[])[1]||'';const receiptDate=receiptDateToISO((t.match(/Date\s*:\s*(\d{2}[.\/-]\d{2}[.\/-]\d{4})/i)||[])[1]||'');const pm=t.match(/Period\s*From\s*:\s*(\d{2}[.\/-]\d{2}[.\/-]\d{4})\s*To\s*(\d{2}[.\/-]\d{2}[.\/-]\d{4})/i)||[];const fromDate=receiptDateToISO(pm[1]||''),toDate=receiptDateToISO(pm[2]||'');const poMatch=t.match(/Purchase\s+Order\s+NO\s*:\s*([0-9]+)/i);const poNumber=poMatch?poMatch[1]:'';const lines=[];const rowRe=/(\d+)\s+(\d{2}[.\/-]\d{2}[.\/-]\d{4})\s+(W[A-Z0-9]+)\s+([A-Z0-9]+)\s+([0-9]+(?:\.[0-9]+)?)\s+MT\b/gi;let m;while((m=rowRe.exec(t))){lines.push({sno:m[1],date:receiptDateToISO(m[2]),wc:m[3].toUpperCase(),vehicle:m[4].toUpperCase(),qty:Number(m[5])})}return {receiptNumber:unique,receiptDate,fromDate,toDate,poNumber,lines};}

async function extractBillingReceipt(e){const f=e.target.files?.[0];if(!f)return;const st=$('brFileStatus');if(st)st.textContent=`Selected ${f.name}. Extracting…`;try{if(f.type!=='application/pdf')throw new Error('Please upload the ITC Wood Receipt Summary PDF.');let text='';const pdf=await pdfjsFromFile(f);for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent({normalizeWhitespace:true});text+=' '+tc.items.map(x=>x.str).join(' ')}const parsed=parseWoodReceiptSummary(text);if(!parsed.receiptNumber||!parsed.receiptDate||!parsed.fromDate||!parsed.toDate||!parsed.lines.length)throw new Error('The PDF was read, but the Wood Receipt Summary fields/lines could not be reliably extracted.');const d={receiptNumber:parsed.receiptNumber,receiptDate:parsed.receiptDate,fromDate:parsed.fromDate,toDate:parsed.toDate,poNumber:parsed.poNumber,text,lines:parsed.lines};saveForm('billingReceipt',d);if($('brNo'))$('brNo').value=parsed.receiptNumber;if($('brDate'))$('brDate').value=parsed.receiptDate;if($('brFrom'))$('brFrom').value=parsed.fromDate;if($('brTo'))$('brTo').value=parsed.toDate;if($('brPo'))$('brPo').value=parsed.poNumber;if($('brText'))$('brText').value=text;if($('billingReceiptPreview'))$('billingReceiptPreview').innerHTML=renderBillingReceiptPreview(parsed.lines);if(st)st.textContent=`Extracted ${parsed.lines.length} WC line(s). Review them before saving.`}catch(err){console.error(err);if(st)st.textContent=err.message||'Could not extract automatically.';alert(err.message||'Could not extract automatically.')}}

async function saveAndReconcileBillingReceipt(){const d=loadForm('billingReceipt')||{};const no=($('brNo')?.value||d.receiptNumber||'').trim(),rd=$('brDate')?.value||d.receiptDate||'',fd=$('brFrom')?.value||d.fromDate||'',td=$('brTo')?.value||d.toDate||'',poNumber=($('brPo')?.value||d.poNumber||'').trim(),lines=d.lines||[];if(!no||!rd||!fd||!td)return alert('Receipt number, receipt date, From Date and To Date are required.');if(fd>td)return alert('From Date cannot be after To Date.');if(!lines.length)return alert('No receipt lines are available. Upload and verify the GR first.');const existingReceipt=await sb.from('itc_receipts').select('id').eq('receipt_number',no).limit(1);if(existingReceipt.error)return alert(existingReceipt.error.message);if(existingReceipt.data?.length)return alert(`Receipt ${no} already exists in WoodMaster. It will not be imported twice.`);let poId=null;if(poNumber){const p=state.pos.find(x=>String(x.po_number||'')===poNumber);if(p)poId=p.id}const hdr={receipt_number:no,receipt_date:rd,from_date:fd,to_date:td,po_id:poId,ocr_verified:true,reconciliation_status:'Pending',created_by:state.session.user.id};const hr=await sb.from('itc_receipts').insert(hdr).select().single();if(hr.error)return alert(`Receipt header was not saved: ${hr.error.message}`);const receiptId=hr.data.id;const wcs=lines.map(x=>x.w);const wr=await sb.from('itc_weighments').select('*').in('wc_number',wcs);if(wr.error){await sb.from('itc_receipts').delete().eq('id',receiptId);return alert(`Could not read Final Weighments: ${wr.error.message}`)}const byWc=new Map((wr.data||[]).map(w=>[String(w.wc_number||'').toUpperCase(),w]));const rows=[];let verifiedCount=0,exceptionCount=0;for(const r of lines){let match='Verified',reasons=[],loadId=null;const w=byWc.get(String(r.wc||'').toUpperCase());const l=w?state.loads.find(x=>x.id===w.load_id):null;if(!w||!l){match='WC Not Found';reasons.push('No matching Final Weighment/WC found in WoodMaster.')}else{loadId=w.load_id;const approved=num(w.approved_weight);if(poNumber&&String(l.po_master?.po_number||'')!==poNumber){match='PO Mismatch';reasons.push(`Receipt PO ${poNumber} vs Load PO ${l.po_master?.po_number||'—'}.`)}if(Math.abs(approved-num(r.qty))>0.001){if(match==='Verified')match='Quantity Difference';reasons.push(`Receipt ${num(r.qty).toFixed(3)} MT vs Approved ${approved.toFixed(3)} MT.`)}if(String(w.vehicle_number||'').toUpperCase()!==String(r.vehicle||'').toUpperCase()){if(match==='Verified')match='Vehicle Mismatch';reasons.push(`Receipt vehicle ${r.vehicle} vs Final Weighment ${w.vehicle_number||'—'}.`)}}const dup=await sb.from('itc_receipt_items').select('id,receipt_id').eq('wc_number',String(r.wc||'').toUpperCase()).limit(1);if(dup.error){await sb.from('itc_receipts').delete().eq('id',receiptId);return alert(`Could not check duplicate WC ${r.wc}: ${dup.error.message}`)}if(dup.data?.length){match='Duplicate WC';reasons.push('This WC already exists in another receipt import.')}if(match==='Verified')verifiedCount++;else exceptionCount++;rows.push({receipt_id:receiptId,wc_number:String(r.wc||'').toUpperCase(),wc_date:r.date,vehicle_number:String(r.vehicle||'').toUpperCase(),quantity:num(r.qty),load_id:loadId,match_status:match,exception_reason:reasons.join(' ')||null});}const ir=await sb.from('itc_receipt_items').insert(rows);if(ir.error){await sb.from('itc_receipts').delete().eq('id',receiptId);return alert(`Receipt lines were not saved: ${ir.error.message}`)}for(const row of rows){if(row.load_id&&row.match_status==='Verified')await sb.from('loads').update({status:'Receipt Verified'}).eq('id',row.load_id);else if(row.load_id&&['Quantity Difference','Duplicate WC','PO Mismatch','Vehicle Mismatch'].includes(row.match_status))await sb.from('loads').update({status:'Exception'}).eq('id',row.load_id)}const recStatus=exceptionCount===0?'Verified':(verifiedCount>0?'Partially Verified':'Exception');await sb.from('itc_receipts').update({reconciliation_status:recStatus}).eq('id',receiptId);localStorage.setItem('wm360:activeReceipt',receiptId);clearForm('billingReceipt');alert(`Receipt ${no} imported. ${verifiedCount} line(s) verified; ${exceptionCount} exception(s).`);await render();}
function billingLineFromLoad(l,w,ri){const po=l?.po_master,qty=num(w?.approved_weight),woodRate=num(po?.wood_rate),handlingRate=num(po?.handling_other_rate),wood=qty*woodRate,handling=qty*handlingRate,gst=(wood+handling)*0.18,total=wood+handling+gst;return {ri,l,w,po,qty,woodRate,handlingRate,wood,handling,gst,total};}
async function markBillingWaiting(loadId,cutoff,mode){const l=state.loads.find(x=>x.id===loadId);if(!l)return;const ok=confirm(`Mark ${l.dc_number||l.load_number} as Waiting for Next Bill Cycle? It will be automatically carried into the next invoice draft.`);if(!ok)return;const r=await sb.from('loads').update({billing_waiting_next_cycle:true,billing_waiting_since:isoToday(),billing_waiting_reason:`Waiting for next bill cycle (${mode||'billing'})`,status:'Billing Hold'}).eq('id',loadId);if(r.error)return alert(`Could not mark waiting: ${r.error.message}`);await refreshLoads();alert(`${l.dc_number||l.load_number} is marked Waiting for Next Bill Cycle.`);await render();}
async function buildMaterialInvoiceDraft(modeOverride){
  const mode=modeOverride||'manual';
  if(mode!=='manual')return alert('For now, Material Billing is being built using Manual Date Selection. GR upload/reconciliation remains available above for the next stage.');

  const poId=$('biManualPo')?.value||'';
  const fd=$('biManualFrom')?.value||'';
  const td=$('biManualTo')?.value||'';
  const idate=$('biManualDate')?.value||'';

  if(!poId||!fd||!td||!idate)return alert('Purchase Order, From Date, To Date and Invoice Date are required.');
  if(fd>td)return alert('From Date cannot be after To Date.');

  const selectedPO=(state.pos||[]).find(p=>String(p.id)===String(poId));
  if(!selectedPO)return alert('Selected Purchase Order was not found. Refresh Masters and try again.');

  saveBillingInvoiceDraft();

  /*
   * IMPORTANT 360-DEGREE FIX:
   * Query the database directly by the selected PO ID.
   * Do not depend on state.loads + nested po_master matching.
   * This prevents one contractor having another PO's Final Weighments
   * incorrectly included/excluded when several POs exist.
   */
  const loadRes=await sb.from('loads').select(`
    *,
    vehicle_master(vehicle_number,owner_name,driver_name,current_tare),
    po_master(po_number,contractor_id,area_name,species_name,wood_rate,handling_other_rate,amc_rate,hsn_code,customer_id,customer_master(customer_name,gstin))
  `).eq('po_id',poId).order('load_date',{ascending:true}).order('load_number',{ascending:true});

  if(loadRes.error)return alert(`Could not read loads for the selected Purchase Order.\n\n${loadRes.error.message}`);

  const poLoads=loadRes.data||[];
  if(!poLoads.length){
    return alert(`No loads are linked to PO ${selectedPO.po_number||'—'}.\n\nThe Purchase Order exists, but no load row has this PO ID. Please check the PO selected while creating the load.`);
  }

  const loadIds=poLoads.map(x=>x.id).filter(Boolean);

  // Final Weighments are restricted to loads belonging to THIS selected PO.
  const wr=await sb.from('itc_weighments').select('*').in('load_id',loadIds);
  if(wr.error)return alert(`Could not read Final Weighments.\n\n${wr.error.message}`);
  const allW=wr.data||[];

  // Give a precise diagnostic when loads exist but Final Weighments have not
  // yet been entered. Billing must never silently bill from Load Net Weight.
  if(!allW.length){
    const loadList=poLoads.map((l,i)=>`${i+1}. ${l.dc_number||l.load_number||'—'} | ${fmtDate(l.load_date)} | ${String(l.vehicle_master?.vehicle_number||l.vehicle_number||'').toUpperCase()} | Net ${fmt(l.net_weight)} MT`).join('\n');
    return alert(`PO ${selectedPO.po_number||'—'} has ${poLoads.length} load(s), but no Final Weighment is saved for any of them.\n\nBilling requires a Final Weighment with Approved Weight. Open Final Weighments and save the ITC WC details first.\n\nLoads linked to this PO:\n${loadList}`);
  }

  // A load is unavailable only when it is reserved by a LIVE Material Invoice.
  // Cancelled invoice rows are retained for audit history, but they must NOT block
  // the load from being billed again. This is important for the Khammam case where
  // loads can still have invoice_items belonging to an older cancelled invoice.
  let invoiceState;
  try{invoiceState=await getMaterialInvoiceStates(loadIds)}catch(e){return alert(`Could not check existing Material Invoice reservations.\n\n${e.message||e}`)}
  const activeReservationRows=invoiceState.liveItems;
  const billedOrDraftIds=new Set(activeReservationRows.map(x=>x.load_id));

  const loadMap=new Map(poLoads.map(x=>[x.id,x]));
  const source=allW.map(w=>({w,l:loadMap.get(w.load_id)})).filter(x=>x.l&&num(x.w.approved_weight)>0);

  const valid=[];
  for(const x of source){
    const {w,l}=x;
    if(billedOrDraftIds.has(l.id))continue;

    const d=String(w.wc_date||l.load_date||'');
    const carry=Boolean(l.billing_waiting_next_cycle);
    const inPeriod=d>=fd&&d<=td;
    if(carry||inPeriod)valid.push(billingLineFromLoad(l,w,null));
  }

  // Prevent duplicate Final Weighment rows for the same load.
  const seen=new Set();
  const unique=valid.filter(x=>{
    if(seen.has(x.l.id))return false;
    seen.add(x.l.id);
    return true;
  });

  // 360-degree completeness check for THIS PO only:
  // every earlier unbilled load must be billed/reserved, or explicitly carried forward.
  const pendingBeforeFrom=[];
  for(const l of poLoads){
    if(!l?.id)continue;
    if(billedOrDraftIds.has(l.id)||l.billing_waiting_next_cycle===true)continue;

    const w=allW.find(x=>x.load_id===l.id);
    const businessDate=String(w?.wc_date||l.load_date||'');
    if(!businessDate||businessDate>=fd)continue;

    if(w&&num(w.approved_weight)>0){
      pendingBeforeFrom.push({l,w,kind:'ready'});
    }else{
      pendingBeforeFrom.push({l,w:null,kind:'no_final'});
    }
  }

  if(!unique.length&&!pendingBeforeFrom.length){
    const finalCount=allW.length;
    const approvedCount=allW.filter(w=>num(w.approved_weight)>0).length;
    const inPeriodCount=allW.filter(w=>{const d=String(w.wc_date||'');return d>=fd&&d<=td&&num(w.approved_weight)>0;}).length;
    const reservedCount=allW.filter(w=>billedOrDraftIds.has(w.load_id)).length;
    const cancelledReservationCount=invoiceState.items.filter(x=>String(x.material_invoices?.status||'').trim().toLowerCase()==='cancelled').length;
    return alert(
      `No billable Final Weighments found for PO ${selectedPO.po_number||'—'} between ${fmtDate(fd)} and ${fmtDate(td)}.\n\n`+
      `Diagnostic: ${poLoads.length} load(s) linked to this PO; ${finalCount} Final Weighment(s) found; ${approvedCount} with Approved Weight > 0; ${inPeriodCount} with WC Date inside the selected period; ${reservedCount} already reserved by a live invoice; ${cancelledReservationCount} item(s) belong to Cancelled invoice(s) and are not blocking.\n\n`+
      `Billing uses WC Date (not Load Date) and Approved Weight. If the Final Weighment exists but its WC Date is outside ${fmtDate(fd)}–${fmtDate(td)}, change the billing period to the actual WC Date.`
    );
  }

  const preview=await sb.rpc('peek_shared_invoice_number',{p_invoice_date:idate});
  const invoiceNo=preview.error?'—':(preview.data||'—');
  const totalQty=unique.reduce((a,x)=>a+x.qty,0);
  const rows=unique.map((x,i)=>`<tr><td>${i+1}</td><td>${fmtDate(x.w.wc_date)}</td><td>${esc(x.w.wc_number)}</td><td>${esc(String(x.w.vehicle_number||x.l.vehicle_master?.vehicle_number||'').toUpperCase())}</td><td>${fmt(x.qty)}</td><td>MT</td></tr>`).join('');

  let pendingHtml='';
  if(pendingBeforeFrom.length){
    const pRows=pendingBeforeFrom.map((x,i)=>{
      const l=x.l,w=x.w;
      const status=x.kind==='ready'?'Final Weighment ready but not billed':'Final Weighment not yet available';
      const date=w?.wc_date||l.load_date;
      return `<tr><td>${i+1}</td><td>${fmtDate(date)}</td><td>${esc(w?.wc_number||'—')}</td><td>${esc(String(w?.vehicle_number||l.vehicle_master?.vehicle_number||'').toUpperCase())}</td><td>${w?fmt(w.approved_weight):'—'}</td><td>${esc(l.dc_number||l.load_number||'—')}</td><td>${status}</td><td><button class="btn secondary" type="button" onclick="markBillingWaitingAndRefresh('${l.id}')">Waiting for Next Bill Cycle</button></td></tr>`;
    }).join('');
    pendingHtml=`<div class="notice error" style="margin-top:12px"><b>⚠ Billing completeness warning</b><br>There are ${pendingBeforeFrom.length} earlier unbilled load(s) for this PO before the selected From Date (${fmtDate(fd)}). To avoid silently leaving a load out of billing, each must be accounted for before the draft can be prepared. You can mark a load as <b>Waiting for Next Bill Cycle</b>; it will automatically be included in the next billing cycle.</div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>S.No</th><th>Date</th><th>WC Number</th><th>Truck Number</th><th>Approved Qty</th><th>DC Number</th><th>Reason</th><th>Action</th></tr></thead><tbody>${pRows}</tbody></table></div>`;
  }

  const blockNote=pendingBeforeFrom.length?`<div class="notice error" style="margin-top:12px"><b>Prepare Draft Bill is blocked</b> until the earlier pending loads for this PO are either billed/reserved in an invoice or explicitly marked Waiting for Next Bill Cycle.</div>`:'';
  const body=`<div class="notice"><b>Purchase Order:</b> ${esc(selectedPO.po_number||'')} &nbsp; | &nbsp; <b>Billing Period:</b> ${fmtDate(fd)} to ${fmtDate(td)} &nbsp; | &nbsp; <b>Invoice Date:</b> ${fmtDate(idate)} &nbsp; | &nbsp; <b>Auto Invoice No:</b> ${esc(invoiceNo)}</div>${pendingHtml}<div class="sectionhead" style="margin-top:14px">Final Billable Loads — Verify Before Preparing Draft</div><div class="tablewrap"><table><thead><tr><th>S.No</th><th>Date</th><th>WC Number</th><th>Truck Number</th><th>Approved Quantity</th><th>UOM</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">No loads selected for this period.</td></tr>`}</tbody><tfoot><tr><th colspan="4" style="text-align:right">Total Quantity</th><th>${fmt(totalQty)}</th><th>MT</th></tr></tfoot></table></div><div class="notice" style="margin-top:12px">Please verify that these are the final loads for this billing cycle. <b>Prepare Draft Bill</b> will create the Material Invoice as a Draft only; loads will not be marked Billed until the invoice is finalized.</div>${blockNote}`;

  saveForm('billingInvoice',{mode:'manual',poId,manualFromDate:fd,manualToDate:td,invoiceDate:idate,confirmationLines:unique.map(x=>({load_id:x.l.id,wc_number:x.w.wc_number,approved_qty:x.qty,wood_rate:x.woodRate,wood_value:x.wood,handling_rate:x.handlingRate,handling_value:x.handling,gst:x.gst,total:x.total})),confirmationInvoiceNo:invoiceNo,pendingBeforeFrom:pendingBeforeFrom.map(x=>x.l.id)});
  showModal('Material Billing — Final Confirmation',body,pendingBeforeFrom.length?'blockManualMaterialDraft()':'prepareManualMaterialDraft()','Prepare Draft Bill');
}
function blockManualMaterialDraft(){alert('Draft Bill cannot be prepared yet. Please account for every earlier unbilled load shown in the Billing completeness warning. Mark it Waiting for Next Bill Cycle if it should be carried forward.');}

  const r=await sb.from('loads').update({billing_waiting_next_cycle:true,billing_waiting_since:isoToday(),billing_waiting_reason:'Waiting for next bill cycle (manual billing completeness check)',status:'Billing Hold'}).eq('id',loadId);

  closeModal();

  if($('biManualFrom')){await buildMaterialInvoiceDraft('manual');}

async function prepareManualMaterialDraft(){

  try{stateCheck=await getMaterialInvoiceStates(ids)}catch(e){return alert(e.message||String(e))}

  }

  const numberRes=await sb.rpc('allocate_shared_invoice_number',{p_invoice_date:idate});if(numberRes.error)return alert(`Could not allocate the shared invoice number. ${numberRes.error.message}`);const ino=numberRes.data;
  const totals=lines.reduce((a,x)=>({qty:a.qty+x.approved_qty,mv:a.mv+x.wood_value,hv:a.hv+x.handling_value,gst:a.gst+x.gst,total:a.total+x.total}),{qty:0,mv:0,hv:0,gst:0,total:0});
  const inv={invoice_number:ino,invoice_date:idate,from_date:fd,to_date:td,itc_id:itc.id,total_qty:totals.qty,material_value:totals.mv,handling_value:totals.hv,gst:totals.gst,invoice_total:totals.total,status:'Draft',billing_method:'Manual Date Selection',created_by:state.session.user.id};
  const ir=await sb.from('material_invoices').insert(inv).select().single();if(ir.error)return alert(`Draft bill was not created: ${ir.error.message}`);
  const rows=lines.map(x=>({...x,invoice_id:ir.data.id}));const rr=await sb.from('invoice_items').insert(rows);if(rr.error){await sb.from('material_invoices').delete().eq('id',ir.data.id);return alert(`Draft bill lines were not saved: ${rr.error.message}`)}
  clearForm('billingInvoice');closeModal();alert(`Material Draft Bill ${ino} prepared for ${fmt(totals.qty)} MT.`);await refreshLoads();await render();
}
function invoiceActionAllowed(action,status){
  // Central permission hook. For now all authenticated users may act; later role-based
  // permissions can be enforced here without changing invoice screens/workflows.
  if(!state.session?.user)return false;
  return ['edit','delete','finalize'].includes(action) && ['Draft','Finalized'].includes(status);
}
async function getMaterialInvoiceBundle(id){
  const ir=await sb.from('material_invoices').select('*').eq('id',id).maybeSingle();
  if(ir.error)throw ir.error;
  if(!ir.data)throw new Error('Material invoice not found.');
  const rr=await sb.from('invoice_items').select('*').eq('invoice_id',id).order('created_at',{ascending:true});
  if(rr.error)throw rr.error;
  const items=rr.data||[];
  const loadIds=items.map(x=>x.load_id).filter(Boolean);
  let weighments=[];
  if(loadIds.length){
    const wr=await sb.from('itc_weighments').select('load_id,vehicle_number,wc_number').in('load_id',loadIds);
    if(wr.error)throw wr.error;
    weighments=wr.data||[];
  }
  const vm=new Map(weighments.map(x=>[x.load_id,x]));
  return {invoice:ir.data,items:items.map(x=>({...x,vehicle_number:vm.get(x.load_id)?.vehicle_number||''}))};
}

}
async function editMaterialInvoice(id){
  try{
    const {invoice,items}=await getMaterialInvoiceBundle(id);
    if(!invoiceActionAllowed('edit',invoice.status))return alert('You do not have permission to edit this invoice.');
    const final=invoice.status==='Finalized';
    const body=`<div class="notice"><b>${esc(invoice.invoice_number)}</b> — ${esc(invoice.status)}. ${final?'Final invoice editing is recorded; removing a line releases that load back to Ready for Material Invoice.':'Draft editing can change the header and remove lines before finalization.'}</div>
      <div class="formgrid"><div class="field"><label>Invoice Date *</label><input id="eiDate" type="date" value="${esc(invoice.invoice_date||'')}"></div><div class="field"><label>From Date</label><input id="eiFrom" type="date" value="${esc(invoice.from_date||'')}"></div><div class="field"><label>To Date</label><input id="eiTo" type="date" value="${esc(invoice.to_date||'')}"></div><div class="field"><label>Invoice Number</label><input class="readonly" readonly value="${esc(invoice.invoice_number)}"></div></div>

async function saveMaterialInvoiceEdit(id){
  try{
    const {invoice,items}=await getMaterialInvoiceBundle(id);
    if(!invoiceActionAllowed('edit',invoice.status))return alert('You do not have permission to edit this invoice.');
    const date=$('eiDate')?.value||'',from=$('eiFrom')?.value||null,to=$('eiTo')?.value||null;
    if(!date)return alert('Invoice Date is required.');
    if(from&&to&&from>to)return alert('From Date cannot be after To Date.');
    const keep=items.filter(x=>$(`invKeep_${x.id}`)?.checked);
    if(!keep.length)return alert('At least one invoice line must remain. Use Delete to cancel the whole invoice if it should contain no loads.');
    const removed=items.filter(x=>!keep.some(k=>k.id===x.id));
    const totals=keep.reduce((a,x)=>({qty:a.qty+num(x.approved_qty),mv:a.mv+num(x.wood_value),hv:a.hv+num(x.handling_value),gst:a.gst+num(x.gst),total:a.total+num(x.total)}),{qty:0,mv:0,hv:0,gst:0,total:0});
    const upd=await sb.from('material_invoices').update({invoice_date:date,from_date:from,to_date:to,total_qty:totals.qty,material_value:totals.mv,handling_value:totals.hv,gst:totals.gst,invoice_total:totals.total,updated_at:new Date().toISOString()}).eq('id',id);
    if(upd.error)return alert(`Invoice was not updated: ${upd.error.message}`);
    if(removed.length){
      const del=await sb.from('invoice_items').delete().in('id',removed.map(x=>x.id));

      for(const x of removed){await sb.from('loads').update({status:'Ready for Material Invoice'}).eq('id',x.load_id)}
    }
    await sb.from('audit_log').insert({user_id:state.session.user.id,module:'Material Billing',record_id:id,action:'EDIT_INVOICE',old_value:JSON.stringify({status:invoice.status,invoice_date:invoice.invoice_date,from_date:invoice.from_date,to_date:invoice.to_date,total_qty:invoice.total_qty,invoice_total:invoice.invoice_total}),new_value:JSON.stringify({status:invoice.status,invoice_date:date,from_date:from,to_date:to,total_qty:totals.qty,invoice_total:totals.total}),reason:invoice.status==='Finalized'?'Edited finalized invoice':'Edited draft invoice'});
    closeModal();alert(`${invoice.status==='Finalized'?'Final':'Draft'} invoice ${invoice.invoice_number} updated. The invoice number remains unchanged.`);await refreshLoads();await render();
  }catch(e){alert(`Could not save invoice changes: ${e.message||e}`)}
}
async function finalizeMaterialInvoice(id){
  try{
    const {invoice,items}=await getMaterialInvoiceBundle(id);
    if(!invoiceActionAllowed('finalize',invoice.status))return alert('You do not have permission to finalize this invoice.');
    if(invoice.status!=='Draft')return alert('Only Draft invoices can be finalized.');
    if(!items.length)return alert('Cannot finalize an invoice with no lines.');
    let stateCheck;
    try{stateCheck=await getMaterialInvoiceStates(items.map(x=>x.load_id))}catch(e){return alert(e.message||String(e))}
    const conflicts=stateCheck.liveItems.filter(x=>x.invoice_id!==id);
    if(conflicts.length)return alert('One or more loads are already reserved by another invoice. Refresh and resolve the conflict before finalizing.');
    const ok=confirm(`Finalize invoice ${invoice.invoice_number}? ${items.length} load(s) will be marked Billed. This should only be done after the draft is fully checked.`);if(!ok)return;
    const priorStatuses=[];
    for(const x of items){
      const l=state.loads.find(v=>v.id===x.load_id);
      priorStatuses.push({id:x.load_id,status:l?.status||'Ready for Material Invoice'});
      const lr=await sb.from('loads').update({status:'Billed',billing_waiting_next_cycle:false}).eq('id',x.load_id);
      if(lr.error){
        for(const prev of priorStatuses){await sb.from('loads').update({status:prev.status}).eq('id',prev.id)}
        return alert(`Invoice was not finalized because load ${x.load_id} could not be marked Billed: ${lr.error.message}`);
      }
    }
    const r=await sb.from('material_invoices').update({status:'Finalized',updated_at:new Date().toISOString()}).eq('id',id).eq('status','Draft');
    if(r.error){for(const prev of priorStatuses){await sb.from('loads').update({status:prev.status}).eq('id',prev.id)}return alert(`Invoice could not be finalized: ${r.error.message}`)}
    await sb.from('audit_log').insert({user_id:state.session.user.id,module:'Material Billing',record_id:id,action:'FINALIZE_INVOICE',new_value:invoice.invoice_number,reason:'Draft invoice finalized after user review'});
    alert(`Material Invoice ${invoice.invoice_number} is finalized.`);await refreshLoads();await render();
  }catch(e){alert(`Could not finalize invoice: ${e.message||e}`)}
}

async function deleteMaterialInvoice(id){
  try{
    const {invoice}=await getMaterialInvoiceBundle(id);
    if(!invoiceActionAllowed('delete',invoice.status))return alert('You do not have permission to delete this invoice.');
     const isFinal=invoice.status==='Finalized';
     const msg=`⚠️ WARNING — DELETE INVOICE\n\nYou are about to delete ${isFinal?'FINAL':'DRAFT'} invoice ${invoice.invoice_number}.\n\nThis action affects the invoice and its associated loads.\n\n• If this is the LAST invoice number, the invoice will be deleted, its number can be reused, and its loads will be released for billing again.\n• If this is an IN-BETWEEN invoice number, it will be CANCELLED instead; its number will remain permanently blocked and its loads will remain reserved.\n\nDo you want to continue?`;
     if(!confirm(msg))return;
     const confirmText=window.prompt(`FINAL DELETE CONFIRMATION\n\nInvoice: ${invoice.invoice_number}\n\nTo confirm this deletion, type DELETE exactly.`);
     if(confirmText!=='DELETE')return alert('Deletion cancelled. The invoice was not changed.');
    const r=await sb.rpc('delete_material_invoice_with_shared_sequence',{p_invoice_id:id,p_user_id:state.session.user.id});
    if(r.error)return alert(`Invoice could not be processed: ${r.error.message}`);
    const result=r.data||{};
    if(result.reusable){
      alert(`Invoice ${invoice.invoice_number} was deleted. Its number is reusable and its loads are available for billing again.`);
    }else{
      alert(`Invoice ${invoice.invoice_number} was cancelled because it was not the last invoice number. Its number will NOT be reused, and its loads remain reserved.`);
    }
    await refreshLoads();await render();
  }catch(e){alert(`Could not delete invoice: ${e.message||e}`)}
}

function masters(){const c=active();const custOpts=state.customers.map(v=>`<option value="${v.id}" ${c?.default_customer_id===v.id?'selected':''}>${esc(v.customer_name)}${v.gstin?' — '+esc(v.gstin):''}</option>`).join('');return `<div class="context">Contractor is fixed to <b>${esc(c?.contractor_name)}</b>. Customer is the party who issued the PO. Species/Material is entered directly in each PO — there is no Species Master in the UI.</div><h1>Masters</h1><div class="sectionhead">Default Customer</div><div class="card"><div class="formgrid"><div class="field"><label>Regular / Default Customer</label><select id="defaultCustomer">${custOpts}</select></div></div><div class="actions"><button class="btn primary" onclick="setDefaultCustomer()">Save Default Customer</button></div></div><div class="sectionhead">Customer Master</div><div class="card"><div class="formgrid"><div class="field"><label>Customer Name *</label><input id="cuName"></div><div class="field"><label>Customer Code</label><input id="cuCode"></div><div class="field"><label>GSTIN</label><input id="cuGstin"></div><div class="field"><label>PAN</label><input id="cuPan"></div><div class="field full"><label>Address</label><input id="cuAddress"></div></div><div class="actions"><button class="btn primary" onclick="addCustomer()">Add Customer</button></div></div><div class="section"><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Code</th><th>GSTIN</th><th>Actions</th></tr></thead><tbody>${state.customers.map(v=>`<tr><td>${esc(v.customer_name)}</td><td>${esc(v.customer_code||'')}</td><td>${esc(v.gstin||'')}</td><td><div class="rowactions"><button class="btn secondary mini" onclick="editCustomer('${v.id}')">Edit</button><button class="btn danger mini" onclick="deactivateCustomer('${v.id}')">Deactivate</button></div></td></tr>`).join('')}</tbody></table></div></div><div class="sectionhead">PO Master</div><div class="card"><div class="notice">One PO = one material/species. Enter Area here. Operational PO display is <b>PO Number_Area_First 3 letters of Material_First 3 letters of PO Issued Customer</b>.</div><div class="formgrid"><div class="field"><label>Customer *</label><select id="mCustomer">${custOpts}</select></div><div class="field"><label>PO Number *</label><input id="mPoNumber"></div><div class="field"><label>PO Date *</label><input id="mPoDate" type="date" value="${isoToday()}"></div><div class="field"><label>Area *</label><input id="mArea" placeholder="e.g. WARANGAL"></div><div class="field"><label>Valid From</label><input id="mValidFrom" type="date"></div><div class="field"><label>Valid To</label><input id="mValidTo" type="date"></div><div class="field"><label>PO Quantity (MT)</label><input id="mPoQty" type="number" step="0.001"></div><div class="field"><label>Material / Species *</label><input id="mSpecies" placeholder="Eucalyptus Debarked Wood"></div><div class="field"><label>Wood Rate / MT *</label><input id="mWoodRate" type="number" step="0.01"></div><div class="field"><label>Handling & Other / MT</label><input id="mHandling" type="number" step="0.01"></div><div class="field"><label>AMC / MT</label><input id="mAmc" type="number" step="0.01"></div><div class="field"><label>HSN Code</label><input id="mHsn"></div></div><div class="actions"><button class="btn primary" onclick="addPO()">Add PO</button></div></div><div class="section"><div class="tablewrap"><table><thead><tr><th>PO</th><th>Customer</th><th>Area</th><th>Material</th><th>Qty MT</th><th>Wood Rate</th><th>Handling</th><th>AMC</th><th>Actions</th></tr></thead><tbody>${state.pos.map(v=>`<tr><td>${esc(poLabel(v))}</td><td>${esc(v.customer_master?.customer_name||'')}</td><td>${esc(v.area_name||'')}</td><td>${esc(v.species_name||'')}</td><td>${fmt(v.po_qty)}</td><td>${money(v.wood_rate)}</td><td>${money(v.handling_other_rate)}</td><td>${money(v.amc_rate)}</td><td><div class="rowactions"><button class="btn secondary mini" onclick="editPO('${v.id}')">Edit</button><button class="btn danger mini" onclick="deactivatePO('${v.id}')">Deactivate</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function contractors(){return `<div class="topbar"><div><h1>Contractors</h1><div class="sub">Select a contractor to work with its isolated operational records.</div></div><button class="btn primary" onclick="showRegistration()">＋ Register New Contractor</button></div><div class="contractor-grid">${state.contractors.map(c=>`<div class="contractor-card" onclick="selectContractor('${c.id}')"><div style="font-size:30px">🌲</div><div class="contractor-name">${esc(c.contractor_name)}</div><div class="contractor-meta">${esc(c.contractor_code||'')} · ${esc(c.gstin||'')}</div><div class="contractor-action">Open Contractor →</div></div>`).join('')}<div class="contractor-card" onclick="showRegistration()"><div style="font-size:30px">＋</div><div class="contractor-name">Register New Contractor</div><div class="contractor-meta">Upload GST certificate and verify details.</div></div></div>`}
function registrationPage(){return `<div class="topbar"><div><h1>Register New Contractor</h1><div class="sub">Upload GST registration certificate. Extraction is performed in the browser and the file is not stored in Supabase.</div></div></div><div class="form"><div class="field"><label>GST Registration Certificate (PDF)</label><input id="gstFile" type="file" accept="application/pdf"></div><div id="gstStatus" class="statusbar" style="margin-top:10px">Choose a certificate to extract GSTIN, PAN, legal name, trade name, constitution and address.</div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Trade / Contractor Name *</label><input id="rTrade"></div><div class="field"><label>Legal Name</label><input id="rLegal"></div><div class="field"><label>Contractor Code</label><input id="rCode" placeholder="CON-001"></div><div class="field"><label>GSTIN</label><input id="rGstin"></div><div class="field"><label>PAN</label><input id="rPan"></div><div class="field"><label>Constitution</label><input id="rConst"></div><div class="field full"><label>Registered / Principal Place of Business Address</label><textarea id="rAddress"></textarea></div></div><div class="actions"><button class="btn primary" onclick="createContractor()">Create Contractor</button><button class="btn secondary" onclick="go('contractors')">Cancel</button></div></div>`}
async function extractGST(e){const f=e.target.files?.[0];if(!f)return;try{const pdf=await pdfjsFromFile(f);let t='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent({normalizeWhitespace:true});t+=' '+tc.items.map(x=>x.str).join(' ')}const gst=(t.match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]\b/i)||[])[0]||'';const pan=gst?gst.slice(2,12):'';const legal=(t.match(/Legal Name of Business\s*([A-Z0-9 .&'-]+?)(?=Trade Name|Constitution|$)/i)||[])[1]?.trim()||'';const trade=(t.match(/Trade Name, if any\s*([A-Z0-9 .&'-]+?)(?=Constitution|Address|$)/i)||[])[1]?.trim()||'';const cons=(t.match(/Constitution of Business\s*([A-Za-z]+)/i)||[])[1]||'';$('rGstin').value=gst;$('rPan').value=pan;$('rLegal').value=legal;$('rTrade').value=trade;$('rConst').value=cons;$('gstStatus').textContent=`Extraction complete. Verify all fields before saving. ${gst?'GSTIN '+gst:'GSTIN not found; enter manually.'}` }catch(err){$('gstStatus').textContent='Could not extract automatically. Enter/verify fields manually.'}}
async function createContractor(){const row={contractor_name:$('rTrade').value.trim()||$('rLegal').value.trim(),contractor_code:$('rCode').value.trim()||null,gstin:$('rGstin').value.trim()||null,pan:$('rPan').value.trim()||null,address:$('rAddress').value.trim()||null,is_active:true};if(!row.contractor_name)return alert('Contractor name is required.');const r=await sb.from('contractor_master').insert(row).select().single();if(r.error)return alert(r.error.message);alert('Contractor created successfully.');await refreshContractors();state.page='contractors';await render()}
function editCustomer(id){const x=state.customers.find(v=>v.id===id);showModal('Edit Customer',`<div class="formgrid"><div class="field"><label>Customer Name *</label><input id="ecName" value="${esc(x.customer_name)}"></div><div class="field"><label>Code</label><input id="ecCode" value="${esc(x.customer_code||'')}"></div><div class="field"><label>GSTIN</label><input id="ecGstin" value="${esc(x.gstin||'')}"></div><div class="field"><label>PAN</label><input id="ecPan" value="${esc(x.pan||'')}"></div><div class="field full"><label>Address</label><textarea id="ecAddress">${esc(x.address||'')}</textarea></div></div>`,`saveCustomer('${id}')`,'Save Customer')}
async function saveCustomer(id){const r=await sb.from('customer_master').update({customer_name:$('ecName').value.trim(),customer_code:$('ecCode').value.trim()||null,gstin:$('ecGstin').value.trim()||null,pan:$('ecPan').value.trim()||null,address:$('ecAddress').value.trim()||null}).eq('id',id);if(r.error)return alert(r.error.message);closeModal();await refreshMasters();await render()}
async function deactivateCustomer(id){if(!confirm('Deactivate this customer? Historical records remain.'))return;const r=await sb.from('customer_master').update({is_active:false}).eq('id',id);if(r.error)return alert(r.error.message);await refreshMasters();await render()}
function editPO(id){const x=state.pos.find(v=>v.id===id);showModal('Edit Purchase Order',`<div class="notice">Contractor is fixed. Customer is the PO issuer. Material is entered directly on the PO.</div><div class="formgrid"><div class="field"><label>PO Number *</label><input id="epNumber" value="${esc(x.po_number)}"></div><div class="field"><label>Customer *</label><select id="epCustomer">${state.customers.map(c=>`<option value="${c.id}" ${c.id===x.customer_id?'selected':''}>${esc(c.customer_name)}</option>`).join('')}</select></div><div class="field"><label>PO Date</label><input id="epDate" type="date" value="${esc(x.po_date||'')}"></div><div class="field"><label>Area *</label><input id="epArea" value="${esc(x.area_name||'')}"></div><div class="field"><label>Valid From</label><input id="epFrom" type="date" value="${esc(x.valid_from||x.validity_from||'')}"></div><div class="field"><label>Valid To</label><input id="epTo" type="date" value="${esc(x.valid_to||x.validity_to||'')}"></div><div class="field"><label>PO Quantity</label><input id="epQty" type="number" step="0.001" value="${x.po_qty??0}"></div><div class="field"><label>Material / Species *</label><input id="epSpecies" value="${esc(x.species_name||'')}"></div><div class="field"><label>Wood Rate / MT *</label><input id="epWood" type="number" step="0.01" value="${x.wood_rate??0}"></div><div class="field"><label>Handling & Other / MT</label><input id="epHandling" type="number" step="0.01" value="${x.handling_other_rate??0}"></div><div class="field"><label>AMC / MT</label><input id="epAmc" type="number" step="0.01" value="${x.amc_rate??0}"></div><div class="field"><label>HSN</label><input id="epHsn" value="${esc(x.hsn_code||'')}"></div></div>`,`savePO('${id}')`,'Save PO')}
async function savePO(id){const row={po_number:$('epNumber').value.trim(),customer_id:$('epCustomer').value,po_date:$('epDate').value||null,area_name:$('epArea').value.trim(),valid_from:$('epFrom').value||null,valid_to:$('epTo').value||null,po_qty:num($('epQty').value),species_name:$('epSpecies').value.trim(),wood_rate:num($('epWood').value),handling_other_rate:num($('epHandling').value),amc_rate:num($('epAmc').value),hsn_code:$('epHsn').value.trim()||null};const r=await sb.from('po_master').update(row).eq('id',id).eq('contractor_id',active().id);if(r.error)return alert(r.error.message);closeModal();await refreshMasters();await render()}
async function deactivatePO(id){if(!confirm('Deactivate this PO? Existing loads remain.'))return;const r=await sb.from('po_master').update({is_active:false}).eq('id',id).eq('contractor_id',active().id);if(r.error)return alert(r.error.message);await refreshMasters();await render()}
async function addCustomer(){const row={customer_name:$('cuName').value.trim(),customer_code:$('cuCode').value.trim()||null,gstin:$('cuGstin').value.trim()||null,pan:$('cuPan').value.trim()||null,address:$('cuAddress').value.trim()||null,is_active:true};if(!row.customer_name)return alert('Customer Name is required.');const r=await sb.from('customer_master').insert(row);if(r.error)return alert(r.error.message);await refreshMasters();await render()}
async function setDefaultCustomer(){const r=await sb.from('contractor_master').update({default_customer_id:$('defaultCustomer').value||null}).eq('id',active().id);if(r.error)return alert(r.error.message);active().default_customer_id=$('defaultCustomer').value;alert('Default customer saved.');}
async function addPO(){const row={customer_id:$('mCustomer').value,contractor_id:active().id,po_number:$('mPoNumber').value.trim(),po_date:$('mPoDate').value||null,area_name:$('mArea').value.trim(),valid_from:$('mValidFrom').value||null,valid_to:$('mValidTo').value||null,po_qty:num($('mPoQty').value),species_name:$('mSpecies').value.trim(),wood_rate:num($('mWoodRate').value),handling_other_rate:num($('mHandling').value),amc_rate:num($('mAmc').value),hsn_code:$('mHsn').value.trim()||null,is_active:true};if(!row.customer_id||!row.po_number||!row.area_name||!row.species_name)return alert('Customer, PO Number, Area and Material are required.');const r=await sb.from('po_master').insert(row);if(r.error)return alert(r.error.message);await refreshMasters();await render()}
function go(p){if(p!=='contractors'&&!active()){state.page='contractors';return render()}state.page=p;render()}
function selectContractor(id){state.selectedContractor=state.contractors.find(x=>x.id===id)||null;sessionStorage.setItem('wm360:contractor',id);state.page='dashboard';render()}
function changeContractor(){state.selectedContractor=null;sessionStorage.removeItem('wm360:contractor');state.page='contractors';render()}
function showRegistration(){state.page='registration';render()}
async function logout(){await sb.auth.signOut();state.session=null;state.selectedContractor=null;state.page='contractors';render()}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)$('authmsg').innerHTML=`<div class="notice error">${esc(r.error.message)}</div>`}
async function signup(){const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authmsg').innerHTML=`<div class="notice ${r.error?'error':'success'}">${esc(r.error?.message||'Account created. Check email if confirmation is enabled.')}</div>`}
function loginPage(){return `<div class="login"><div class="loginbox"><h1>🌲 WoodMaster</h1><div class="sub">Transport agency operations, load, documents, ITC, freight and billing.</div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password"></div><div class="actions"><button class="btn primary" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div><div id="authmsg"></div></div></div>`}
async function render(){const app=$('app');if(!state.session){app.innerHTML=loginPage();return}try{if(!state.contractors.length)await refreshContractors();if(state.page==='contractors'){app.innerHTML=shell(contractors());return}if(state.page==='registration'){app.innerHTML=shell(registrationPage());return}if(!active()){const saved=sessionStorage.getItem('wm360:contractor');if(saved)state.selectedContractor=state.contractors.find(x=>x.id===saved)||null}if(!active()){state.page='contractors';app.innerHTML=shell(contractors());return}await refreshMasters();if(['dashboard','loads','loaddetail','itc','itcdetail','billing','freight','freightdetail'].includes(state.page)||state.page==='newload'||state.page==='editload')await refreshLoads();let body='';if(state.page==='dashboard')body=dashboard();else if(state.page==='loads')body=`<div class="context">Active Contractor: <b>${esc(active().contractor_name)}</b></div><div class="topbar"><div><h1>Loads</h1><div class="sub">All loads belonging to ${esc(active().contractor_name)}.</div></div><button class="btn primary" onclick="go('newload')">＋ New Load</button></div>${loadTable(state.loads)}`;else if(state.page==='newload')body=await newLoad();else if(state.page==='editload')body=await newLoad(state.editLoad);else if(state.page==='loaddetail')body=await loadDetailPage();else if(state.page==='masters')body=masters();else if(state.page==='itc')body=await itcPage();else if(state.page==='itcdetail')body=await itcDetailPage();else if(state.page==='freight')body=await freightPage();else if(state.page==='freightdetail')body=await freightDetailPage();else if(state.page==='billing')body=await billingPage();else if(state.page==='amc')body=amcPage();else if(state.page==='documents')body=documentsPage();else body=dashboard();app.innerHTML=shell(body);if(state.page==='newload'||state.page==='editload'){bindNewLoad();onPO();calcNet();toggleAdvanceOther()}if(state.page==='itcdetail')bindItcForm();if(state.page==='freightdetail'){bindFreightForm(state.selectedLoad?.id)}if(state.page==='registration'){}if(state.page==='contractors'){}if(state.page==='masters'){if($('defaultCustomer'))$('defaultCustomer').value=active().default_customer_id||'';if($('mCustomer'))$('mCustomer').value=active().default_customer_id||''}}catch(e){app.innerHTML=shell(`<h1>Error</h1><div class="notice error">${esc(e.message||e)}</div><button class="btn secondary" onclick="go('contractors')">Return to Contractors</button>`)} }
// Wire GST registration after render through delegated listener.
document.addEventListener('change',e=>{if(e.target.id==='gstFile')extractGST(e)});
sb.auth.onAuthStateChange((_e,s)=>{state.session=s;if(!s){state.selectedContractor=null;state.page='contractors'}render()});
sb.auth.getSession().then(({data})=>{state.session=data.session;const saved=sessionStorage.getItem('wm360:contractor');if(saved)state.selectedContractor=state.contractors.find(x=>x.id===saved)||null;render()});
</script></body></html>
