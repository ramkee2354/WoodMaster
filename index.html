<!doctype html>
<html lang="en">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#1769aa;--primary2:#0f5d93;--success:#16845b;--danger:#c62828;--warn:#b26a00;--info:#eef7ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}header{height:64px;background:#123b5d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-size:21px;font-weight:700}.user{font-size:13px;opacity:.9}.layout{display:flex;min-height:calc(100vh - 64px)}nav{width:215px;background:#fff;border-right:1px solid var(--line);padding:14px;flex:none}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:8px;margin:3px 0;color:#344054;cursor:pointer;font-size:14px}nav button:hover,nav button.active{background:#eaf3fb;color:#125a8d;font-weight:600}main{flex:1;padding:25px;max-width:1550px;margin:auto;width:100%}h1{font-size:25px;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px #00000008}.metric{font-size:27px;font-weight:700;margin-top:7px}.label{font-size:12px;color:var(--muted)}.section{margin-top:18px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{color:#475467;background:#fafafa}.empty{text-align:center;padding:28px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;font-weight:600;color:#475467;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;outline:none}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1769aa18}.field.full{grid-column:1/-1}.readonly{background:#f2f4f7!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f6;color:#344054}.danger{background:#fff0f0!important;color:var(--danger)!important;border:1px solid #f3c3c3!important}.success{background:#effaf5!important;color:#11633f!important;border:1px solid #bde8d1!important}.notice{padding:12px 14px;border-radius:8px;background:#eef7ff;border:1px solid #cfe7fb;color:#17527c;font-size:13px;margin-bottom:15px}.notice.error{background:#fff1f1;border-color:#f3c3c3;color:#9d1c1c}.notice.success{background:#effaf5;border-color:#bde8d1;color:#11633f}.small{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4f8;font-size:11px;color:#355b73}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.context{background:#eaf3fb;border:1px solid #c9e1f3;border-radius:9px;padding:10px 13px;margin-bottom:18px;color:#15527c;font-size:13px}.contractor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.contractor-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer}.contractor-card:hover{box-shadow:0 7px 22px #00000010;border-color:#9fc9e6}.contractor-name{font-size:18px;font-weight:700;margin-top:8px}.contractor-meta{font-size:12px;color:var(--muted);margin-top:5px}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.quick button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;cursor:pointer}.quick button:hover{border-color:#9fc9e6;background:#fafdff}.quick b{display:block;margin-bottom:4px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf5fb,#f7fafc);padding:20px}.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:15px;padding:28px;box-shadow:0 10px 30px #00000010}.loginbox h1{text-align:center;margin-bottom:4px}.loginbox .sub{text-align:center}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modalbox{width:min(950px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 60px #00000030}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.modalclose{border:0;background:#eef2f6;border-radius:8px;padding:8px 12px;cursor:pointer}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:6px 9px;font-size:12px;border-radius:7px}.sectionhead{background:#eaf3fb;border:1px solid #c9e1f3;border-radius:10px;padding:11px 13px;font-weight:700;color:#15527c;margin-top:15px}.docgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.doccard{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.compare>div{padding:10px;border-bottom:1px solid var(--line)}.compare .head{font-weight:700;background:#f7f9fb}.compare .diff{background:#fff6e6}.statusbar{padding:10px;border-radius:8px;background:#f7f9fb;border:1px solid var(--line);font-size:12px}.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;margin-top:15px}.hidden{display:none!important}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.quick,.contractor-grid,.docgrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){header{height:58px;padding:0 14px}.layout{display:block}nav{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px}nav button{white-space:nowrap;width:auto}.grid,.quick,.contractor-grid,.docgrid,.formgrid{grid-template-columns:1fr}main{padding:14px}.field.full{grid-column:auto}.user{display:none}.compare{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script>
const SUPABASE_URL="https://betjenxaqebqhqvjotyd.supabase.co";
const SUPABASE_KEY="sb_publishable_KVBkusGZfcoipZwCkHhJJg_O_u69I2p";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={session:null,page:"contractors",selectedContractor:null,contractors:[],customers:[],pos:[],vehicles:[],loads:[],itcs:[],itcWeighments:[],stats:{},editLoad:null,selectedLoad:null,documents:null,ewayFiles:{}};
const $=id=>document.getElementById(id); const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=v=>Number(v||0); const fmt=v=>Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3}); const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function isoToday(){return new Date().toISOString().slice(0,10)}
function fmtDate(v){if(!v)return "";const s=String(v).slice(0,10);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:s}
function active(){return state.selectedContractor}
function saveForm(key,obj){try{sessionStorage.setItem("wm360:"+key,JSON.stringify(obj))}catch{} }
function loadForm(key){try{return JSON.parse(sessionStorage.getItem("wm360:"+key)||"null")}catch{return null}}
function clearForm(key){try{sessionStorage.removeItem("wm360:"+key)}catch{}}
function formSnapshot(prefix){const ids=["date","vehicle","driver","gross","tare","po","material","eway","wood","handling","amc","freight","advance","advanceBy","advanceOther"];const o={};ids.forEach(k=>{const e=$(prefix+k);if(e)o[k]=e.value});return o}
function restoreSnapshot(prefix,s){if(!s)return;Object.entries(s).forEach(([k,v])=>{const e=$(prefix+k);if(e&&v!=null)e.value=v});}
function navButton(p,label,icon){return `<button class="${state.page===p?'active':''}" onclick="go('${p}')">${icon||''} ${label}</button>`}
function shell(body){return `<header><div class="brand">🌲 WoodMaster</div><div class="user">${esc(state.session?.user?.email||"")}${active()?` | ${esc(active().contractor_name)}`:""}</div></header><div class="layout"><nav>${navButton('dashboard','Dashboard','🏠')}${navButton('loads','Loads','🚚')}${navButton('newload','New Load','＋')}${navButton('masters','Masters','⚙')}${active()?navButton('itc','ITC Weighment','⚖'):''}${active()?navButton('documents','Documents','📄'):''}${active()?navButton('freight','Freight','₹'):''}${active()?navButton('billing','Material Billing','🧾'):''}${active()?navButton('amc','AMC','🧮'):''}${navButton('contractors','Contractors','⇄')}<button onclick="logout()">↪ Sign out</button></nav><main>${body}</main></div>`}
async function refreshAll(){await refreshContractors();if(active())await refreshMasters();if(active())await refreshLoads();}
async function refreshContractors(){const r=await sb.from('contractor_master').select('*').eq('is_active',true).order('contractor_name');if(r.error)throw r.error;state.contractors=r.data||[]}
async function refreshMasters(){const [c,p,v,i]=await Promise.all([sb.from('customer_master').select('*').eq('is_active',true).order('customer_name'),sb.from('po_master').select('*,customer_master(customer_name,gstin)').eq('is_active',true).order('po_number'),sb.from('vehicle_master').select('*').eq('is_active',true).order('vehicle_number'),sb.from('itc_master').select('*').eq('is_active',true).order('company_name')]);if(c.error)throw c.error;if(p.error)throw p.error;if(v.error)throw v.error;if(i.error)throw i.error;state.customers=c.data||[];state.pos=(p.data||[]).filter(x=>!active()||x.contractor_id===active().id);state.vehicles=v.data||[];state.itcs=i.data||[]}
async function refreshLoads(){if(!active()){state.loads=[];return}const r=await sb.from('loads').select('*,vehicle_master(vehicle_number,owner_name,driver_name,current_tare),po_master(po_number,contractor_id,area_name,species_name,wood_rate,handling_other_rate,amc_rate,hsn_code,customer_id,customer_master(customer_name,gstin))').order('load_date',{ascending:false}).order('load_number',{ascending:false}).limit(500);if(r.error)throw r.error;state.loads=(r.data||[]).filter(x=>x.po_master?.contractor_id===active().id||!x.po_master?.contractor_id)}
async function nextDc(){const now=new Date();const fy=(now.getMonth()+1)>=4?`${now.getFullYear()}-${String(now.getFullYear()+1).slice(-2)}`:`${now.getFullYear()-1}-${String(now.getFullYear()).slice(-2)}`;let max=0;const r=await sb.from('loads').select('dc_number').not('dc_number','is',null).limit(5000);if(!r.error)(r.data||[]).forEach(x=>{const parts=String(x.dc_number||'').split('/');if(parts.length===2&&parts[1]===fy)max=Math.max(max,Number(parts[0])||0)});return `${String(max+1).padStart(2,'0')}/${fy}`}
function poLabel(p){const area=String(p.area_name||'').trim().replace(/\s+/g,'_');const mat=String(p.species_name||'').trim().replace(/[^A-Za-z0-9]+/g,'');const cust=String(p.customer_master?.customer_name||'').trim().replace(/[^A-Za-z0-9]+/g,'');return `${p.po_number}_${area}_${mat.slice(0,3).toUpperCase()}_${cust.slice(0,3).toUpperCase()}`}
function dashboard(){const loads=state.loads||[];return `<div class="context">Active Contractor: <b>${esc(active()?.contractor_name)}</b> · ${esc(active()?.contractor_code||'')}</div><div class="topbar"><div><h1>${esc(active()?.contractor_name||'Contractor')}</h1><div class="sub">Contractor dashboard — all operational records below belong to the selected contractor.</div></div><button class="btn secondary" onclick="changeContractor()">⇄ Change Contractor</button></div><div class="grid"><div class="card"><div class="label">Loads</div><div class="metric">${loads.length}</div></div><div class="card"><div class="label">Network Net MT</div><div class="metric">${fmt(loads.reduce((a,x)=>a+num(x.network_net),0))}</div></div><div class="card"><div class="label">Open / Pending Loads</div><div class="metric">${loads.filter(x=>!['Billed','Exception'].includes(x.status)).length}</div></div><div class="card"><div class="label">Active POs</div><div class="metric">${state.pos.length}</div></div></div><div class="section"><h2>Quick Actions</h2><div class="quick"><button onclick="go('newload')"><b>＋ New Load</b><span class="small">Start from the network weighbridge slip.</span></button><button onclick="go('loads')"><b>🚚 Loads</b><span class="small">View, edit and generate documents.</span></button><button onclick="go('masters')"><b>⚙ Masters</b><span class="small">Customers and POs for this contractor.</span></button><button onclick="go('itc')"><b>⚖ ITC Weighment</b><span class="small">Enter and verify ITC card data.</span></button></div></div><div class="section"><h2>Recent Loads</h2>${loadTable(loads.slice(0,10))}</div>`}
function loadTable(loads){if(!loads.length)return `<div class="card empty">No loads for this contractor.</div>`;return `<div class="tablewrap"><table><thead><tr><th>DC Number</th><th>Serial</th><th>Date</th><th>Vehicle</th><th>Net MT</th><th>Freight Rate</th><th>Advance</th><th>E-way</th><th>Status</th></tr></thead><tbody>${loads.map((x,i)=>`<tr><td><button class="btn secondary mini" onclick="loadDetails('${x.id}')">${esc(x.dc_number||'—')}</button></td><td>${i+1}</td><td>${fmtDate(x.load_date)}</td><td>${esc(x.vehicle_master?.vehicle_number||'')}</td><td>${fmt(x.network_net)}</td><td>${money(x.freight_rate)}</td><td>${money(x.advance)}</td><td>${esc(x.eway_bill_no||'')}</td><td><span class="badge">${esc(x.status||'')}</span></td></tr>`).join('')}</tbody></table></div>`}
function loadDetails(id){state.selectedLoad=state.loads.find(x=>x.id===id)||null;state.page='loaddetail';render()}
async function loadDetailPage(){const x=state.selectedLoad;if(!x)return `<div class="notice error">Load not found.</div>`;return `<div class="back" onclick="go('loads')">← Back to Loads</div><div class="topbar"><div><h1>Load ${esc(x.dc_number||x.load_number)}</h1><div class="sub">Complete load details and document workflow.</div></div><div class="rowactions"><button class="btn primary" onclick="editLoad('${x.id}')">Edit Load</button><button class="btn danger" onclick="deleteLoad('${x.id}')">Delete Load</button></div></div>${loadSummary(x)}<div class="section"><h2>Documents</h2><div class="docgrid"><div class="doccard"><b>LR / DC / FL</b><p class="small">Generate draft operational documents.</p><button class="btn primary mini" onclick="openDocsModal('${x.id}')">Generate Documents</button></div><div class="doccard"><b>ITC Weighment</b><p class="small">Enter ITC weighment and compare against load.</p><button class="btn secondary mini" onclick="startItc('${x.id}')">Open ITC</button></div><div class="doccard"><b>Freight Settlement</b><p class="small">Create final freight letter after ITC card.</p><button class="btn secondary mini" onclick="openFreight('${x.id}')">Open Freight</button></div><div class="doccard"><b>Billing</b><p class="small">Receipt and material invoice workflow.</p><button class="btn secondary mini" onclick="go('billing')">Open Billing</button></div></div></div>`}
function loadSummary(x){const p=x.po_master||{};return `<div class="card"><div class="sectionhead">Load Details</div><div class="formgrid"><div class="field"><label>DC Number</label><input class="readonly" readonly value="${esc(x.dc_number||'')}"/></div><div class="field"><label>Date</label><input class="readonly" readonly value="${fmtDate(x.load_date)}"/></div><div class="field"><label>Vehicle</label><input class="readonly" readonly value="${esc(x.vehicle_master?.vehicle_number||'')}"/></div><div class="field"><label>Driver / Owner</label><input class="readonly" readonly value="${esc(x.vehicle_master?.driver_name||x.vehicle_master?.owner_name||'')}"/></div><div class="field"><label>Gross MT</label><input class="readonly" readonly value="${fmt(x.network_gross)}"/></div><div class="field"><label>Tare MT</label><input class="readonly" readonly value="${fmt(x.network_tare)}"/></div><div class="field"><label>Net MT</label><input class="readonly" readonly value="${fmt(x.network_net)}"/></div><div class="field"><label>PO</label><input class="readonly" readonly value="${esc(poLabel(p))}"/></div><div class="field"><label>Material</label><input class="readonly" readonly value="${esc(x.species_name||p.species_name||'')}"/></div><div class="field"><label>E-way Bill</label><input class="readonly" readonly value="${esc(x.eway_bill_no||'')}"/></div><div class="field"><label>Wood Rate / MT</label><input class="readonly" readonly value="${num(p.wood_rate||x.wood_rate)}"/></div><div class="field"><label>Handling & Other / MT</label><input class="readonly" readonly value="${num(p.handling_other_rate||x.handling_other_rate)}"/></div><div class="field"><label>AMC / MT</label><input class="readonly" readonly value="${num(p.amc_rate||x.amc_rate)}"/></div><div class="field"><label>Freight Rate / MT</label><input class="readonly" readonly value="${num(x.freight_rate)}"/></div><div class="field"><label>Advance</label><input class="readonly" readonly value="${money(x.advance)}"/></div><div class="field"><label>Advance Given By</label><input class="readonly" readonly value="${esc(x.advance_given_by||'')}"/></div></div></div>`}
function newLoad(editId=null){const x=editId?state.loads.find(v=>v.id===editId):null;const d=nextDc();return Promise.resolve(d).then(dc=>{const s=x?loadForm('newload'):null;const y=x||{};const p=x?.po_master||{};return `<div class="context">Active Contractor: <b>${esc(active()?.contractor_name)}</b> · ${esc(active()?.contractor_code||'')}</div><div class="topbar"><div><h1>${x?'Edit Load':'New Load'}</h1><div class="sub">${x?'Update existing load details.':'Network weighbridge slip has already been received. Start the process here.'}</div></div><div class="card" style="min-width:290px"><div class="field"><label>DC Number</label><input id="dcNumber" class="readonly" readonly value="${esc(x?.dc_number||dc)}"><div class="small">Automatically generated. Do not enter manually.</div></div></div></div><div class="notice">No Network Receipt Number is required. The network weighment is created automatically with this Load.</div><div class="form"><div class="sectionhead">Load Details</div><div class="formgrid"><div class="field"><label>Date *</label><input id="date" type="date" value="${esc(x?.load_date||s?.date||isoToday())}" required></div><div class="field"><label>Vehicle Number *</label><input id="vehicle" list="vehicleList" value="${esc(x?.vehicle_master?.vehicle_number||s?.vehicle||'')}" placeholder="Enter vehicle number" required oninput="this.value=this.value.toUpperCase()"><datalist id="vehicleList">${state.vehicles.map(v=>`<option value="${esc(v.vehicle_number)}">`).join('')}</datalist></div><div class="field"><label>Driver Name / Owner Name</label><input id="driver" value="${esc(x?.vehicle_master?.driver_name||x?.vehicle_master?.owner_name||s?.driver||'')}"></div><div class="field"><label>Gross Weight (MT) *</label><input id="gross" type="number" step="0.001" value="${x?num(x.network_gross):s?.gross||''}" required></div><div class="field"><label>Tare Weight (MT) *</label><input id="tare" type="number" step="0.001" value="${x?num(x.network_tare):s?.tare||''}" required></div><div class="field"><label>Net Weight (MT)</label><input id="net" class="readonly" readonly value="${x?fmt(x.network_net):''}"></div><div class="field"><label>PO *</label><select id="po" required><option value="">Select PO</option>${state.pos.map(v=>`<option value="${v.id}" ${v.id===(x?.po_id||s?.po)?'selected':''}>${esc(poLabel(v))}</option>`).join('')}</select></div><div class="field"><label>Material</label><input id="material" class="readonly" readonly value="${esc(x?.species_name||p.species_name||'')}"></div><div class="field"><label>E-way Bill Number *</label><div style="display:grid;grid-template-columns:1fr auto;gap:7px"><input id="eway" inputmode="numeric" maxlength="12" value="${esc(x?.eway_bill_no||s?.eway||'')}" placeholder="Enter 12-digit E-way Bill Number" oninput="this.value=this.value.replace(/\D/g,'').slice(0,12); validateEwayField()"><button type="button" class="btn secondary" onclick="document.getElementById('ewayFile').click()">Upload E-way Bill</button></div><input id="ewayFile" type="file" accept="application/pdf,image/*" class="hidden"><div id="ewayStatus" class="small">${state.ewayFiles.__new?`Selected file: ${esc(state.ewayFiles.__new.name)}. Enter the E-way Bill Number manually if extraction is not available.`:'Enter exactly 12 digits. WoodMaster will warn if the E-way Bill Number is invalid.'}</div></div><div class="field"><label>Wood Rate / MT</label><input id="wood" class="readonly" readonly value="${x?num(p.wood_rate||x.wood_rate):''}"></div><div class="field"><label>Handling & Other Charges / MT</label><input id="handling" class="readonly" readonly value="${x?num(p.handling_other_rate||x.handling_other_rate):''}"></div><div class="field"><label>AMC Rate / MT</label><input id="amc" class="readonly" readonly value="${x?num(p.amc_rate||x.amc_rate):''}"></div><div class="field"><label>Freight Rate / MT</label><input id="freight" type="number" step="0.01" value="${x?num(x.freight_rate):s?.freight||''}"></div><div class="field"><label> async function extractEway(e){const f=e.target.files?.[0];if(!f)return; state.ewayFiles.__new=f;const s=$("ewayStatus");s.textContent=`Selected: ${f.name}. Attempting extraction…`;try{let text='';if(f.type==='application/pdf'){const pdf=await pdfjsFromFile(f);for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();text+=' '+tc.items.map(x=>x.str).join(' ')}}else{ text=''; }

 drawPage('DELIVERY CHALLAN', [...common,['Wood Rate / MT',p.wood_rate||x.wood_rate||''],['Handling & Other / MT',p.handling_other_rate||x.handling_other_rate||''],['HSN',p.hsn_code||'']]);

 }
 if(pkg==='LRDCEWAY'||pkg==='LRDCFLEWAY'){

 }
 const bytes=await out.save(); const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${x.dc_number||x.load_number}_Documents.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);closeModal();

async function saveComparedItc(loadId){const x=state.loads.find(v=>v.id===loadId);const wc=$('cmp_wc').value.trim(),d=$('cmp_wcdate').value,ap=num($('cmp_approved').value);if(!wc||!d||!ap)return alert('WC Number, WC Date and Approved Weight are required.');const g=num($('cmp_Gross_Weight')),t=num($('cmp_Tare_Weight')),n=num($('cmp_Net_Weight'));const vehicle=$('cmp_Vehicle_Number').value.trim();const material=$('cmp_Material').value.trim();const row={load_id:loadId,wc_number:wc,wc_date:d,vehicle_number:vehicle,dc_number:x.dc_number,dc_date:x.load_date,material_description:material,gross_weight:g,tare_weight:t,net_weight:n,approved_weight:ap,ocr_verified:true,source:'Manual',created_by:state.session.user.id};const r=await sb.from('itc_weighments').upsert(row,{onConflict:'load_id'}).select().single();if(r.error)return alert(r.error.message);await sb.from('loads').update({status:'ITC Weighment Received'}).eq('id',loadId);if(vehicle){const v=state.vehicles.find(z=>z.vehicle_number===vehicle);if(v)await sb.from('vehicle_master').update({current_tare:t,last_itc_tare_date:d,driver_name:v.driver_name}).eq('id',v.id)}closeModal();alert('ITC Weighment saved successfully.');state.page='loads';await refreshLoads();await render()}

async function extractGST(e){const f=e.target.files?.[0];if(!f)return;try{const pdf=await pdfjsFromFile(f);let t='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent({normalizeWhitespace:true});t+=' '+tc.items.map(x=>x.str).join(' ')}const gst=(t.match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]\b/i)||[])[0]||'';const pan=gst?gst.slice(2,12):'';const legal=(t.match(/Legal Name of Business\s*([A-Z0-9 .&'-]+?)(?=Trade Name|Constitution|$)/i)||[])[1]?.trim()||'';const trade=(t.match(/Trade Name, if any\s*([A-Z0-9 .&'-]+?)(?=Constitution|Address|$)/i)||[])[1]?.trim()||'';const cons=(t.match(/Constitution of Business\s*([A-Za-z]+)/i)||[])[1]||'';$('rGstin').value=gst;$('rPan').value=pan;$('rLegal').value=legal;$('rTrade').value=trade;$('rConst').value=cons;$('gstStatus').textContent=`Extraction complete. Verify all fields before saving. ${gst?'GSTIN '+gst:'GSTIN not found; enter manually.'}` }catch(err){$('gstStatus').textContent='Could not extract automatically. Enter/verify fields manually.'}}

async function signup(){const r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authmsg').innerHTML=`<div class="notice ${r.error?'error':'success'}">${esc(r.error?.message||'Account created. Check email if confirmation is enabled.')}</div>`}
function loginPage(){return `<div class="login"><div class="loginbox"><h1>🌲 WoodMaster</h1><div class="sub">Transport agency operations, load, documents, ITC, freight and billing.</div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password"></div><div class="actions"><button class="btn primary" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div><div id="authmsg"></div></div></div>`}
async function render(){const app=$('app');if(!state.session){app.innerHTML=loginPage();return}try{if(!state.contractors.length)await refreshContractors();if(state.page==='contractors'){app.innerHTML=shell(contractors());return}if(state.page==='registration'){app.innerHTML=shell(registrationPage());return}if(!active()){const saved=sessionStorage.getItem('wm360:contractor');if(saved)state.selectedContractor=state.contractors.find(x=>x.id===saved)||null}if(!active()){state.page='contractors';app.innerHTML=shell(contractors());return}await refreshMasters();if(['dashboard','loads','loaddetail'].includes(state.page)||state.page==='newload'||state.page==='editload')await refreshLoads();let body='';if(state.page==='dashboard')body=dashboard();else if(state.page==='loads')body=`<div class="context">Active Contractor: <b>${esc(active().contractor_name)}</b></div><div class="topbar"><div><h1>Loads</h1><div class="sub">All loads belonging to ${esc(active().contractor_name)}.</div></div><button class="btn primary" onclick="go('newload')">＋ New Load</button></div>${loadTable(state.loads)}`;else if(state.page==='newload')body=await newLoad();else if(state.page==='editload')body=await newLoad(state.editLoad);else if(state.page==='loaddetail')body=await loadDetailPage();else if(state.page==='masters')body=masters();else if(state.page==='itc')body=await itcPage();else if(state.page==='freight')body=await freightPage();else if(state.page==='billing')body=billingPage();else if(state.page==='amc')body=amcPage();else if(state.page==='documents')body=documentsPage();else body=dashboard();app.innerHTML=shell(body);if(state.page==='newload'||state.page==='editload'){bindNewLoad();onPO();calcNet();toggleAdvanceOther()}if(state.page==='registration'){}if(state.page==='contractors'){}if(state.page==='masters'){if($('defaultCustomer'))$('defaultCustomer').value=active().default_customer_id||'';if($('mCustomer'))$('mCustomer').value=active().default_customer_id||''}}catch(e){app.innerHTML=shell(`<h1>Error</h1><div class="notice error">${esc(e.message||e)}</div><button class="btn secondary" onclick="go('contractors')">Return to Contractors</button>`)} }
// Wire GST registration after render through delegated listener.
document.addEventListener('change',e=>{if(e.target.id==='gstFile')extractGST(e)});
sb.auth.onAuthStateChange((_e,s)=>{state.session=s;if(!s){state.selectedContractor=null;state.page='contractors'}render()});
sb.auth.getSession().then(({data})=>{state.session=data.session;const saved=sessionStorage.getItem('wm360:contractor');if(saved)state.selectedContractor=state.contractors.find(x=>x.id===saved)||null;render()});
</script></body></html>
