<script>
const SUPABASE_URL="https://betjenxaqebqhqvjotyd.supabase.co";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const state={

function activeContractor(){

async function refreshContractors(){
 const {data,error}=await sb.from("contractor_master")
  .select("id,contractor_name,contractor_code,gstin,pan,address,default_customer_id,is_active")
  .eq("is_active",true).order("contractor_name");
 if(error) throw error;
 state.contractors=data||[];
}

async function backfillCustomerCodes(){
 const customers=[...(state.customers||[])];
 const used=new Set(customers.map(c=>String(c.customer_code||"").trim().toUpperCase()).filter(Boolean));
 let n=1;
 for(const c of customers){
  if(String(c.customer_code||"").trim()) continue;
  while(used.has(`CUS-${String(n).padStart(3,'0')}`)) n++;
  const code=`CUS-${String(n).padStart(3,'0')}`;
  const {error}=await sb.from("customer_master").update({customer_code:code}).eq("id",c.id);
  if(error) throw error;
  c.customer_code=code;
  used.add(code);
  n++;
 }
 state.customers=customers;
}

async function refreshMasters(){
 const [cu,po,vh]=await Promise.all([
  sb.from("customer_master").select("id,customer_name,customer_code,address,gstin,pan,is_active").eq("is_active",true).order("customer_name"),
  sb.from("po_master").select("id,po_number,po_date,valid_from,valid_to,po_qty,wood_rate,handling_other_rate,amc_rate,species_name,species_id,area_name,customer_id,contractor_id,hsn_code,is_active,customer_master(customer_name,gstin)").eq("is_active",true).order("po_number"),
  sb.from("vehicle_master").select("id,vehicle_number,current_tare,is_active").eq("is_active",true).order("vehicle_number")
 ]);
 if(cu.error)throw cu.error;if(po.error)throw po.error;if(vh.error)throw vh.error;
 state.customers=cu.data||[];
 // Existing AppSheet customers may not have had a Customer Code.
 // Assign a permanent WoodMaster code once, without changing existing codes.
 await backfillCustomerCodes();
 state.pos=(po.data||[]).filter(x=>!activeContractor()||x.contractor_id===activeContractor().id);
  state.vehicles=vh.data||[];
}

async function refreshLoads(){
 if(!activeContractor()){state.loads=[];return;}

 if(error)throw error;
 state.loads=(data||[]).filter(x=>{
   const poContractor=x.po_master?.contractor_id;

}

}

function nextCustomerCode(){

 return `CUS-${String(n).padStart(3,'0')}`;
}

async function nextDCNumber(){
 // WoodMaster DC sequence is based on WoodMaster load records for the current FY.
 // Do not let historical/ITC weighment DC numbers (e.g. an old AppSheet DC 28)
 // force a new WoodMaster test/load sequence to start at 29.
 const {data,error}=await sb.from('loads')
   .select('dc_number,load_date')
   .not('dc_number','is',null)
   .limit(10000);
 if(error) throw error;
 const d=new Date();
 const startYear=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;
 const fy=`${startYear}-${String(startYear+1).slice(-2)}`;
 let max=0;
 for(const r of (data||[])){
   const ds=String(r.load_date||'');
   if(ds){
     const yr=Number(ds.slice(0,4));
     const mo=Number(ds.slice(5,7));
     const rowStart=mo>=4?yr:yr-1;
     if(rowStart!==startYear) continue;
   }
   const m=String(r.dc_number||'').trim().match(/^(\d+)(?:\/\d{4}-\d{2})?$/);
   if(m) max=Math.max(max,Number(m[1]));
 }
 return `${String(max+1).padStart(2,'0')}/${fy}`;
}

async function extractGSTCertificate(e){
 const file=e.target.files?.[0]; if(!file)return;
 const status=$("gstExtractStatus"); status.textContent="Reading GST certificate…";
 try{
  if(!window.pdfjsLib) throw new Error("PDF reader is still loading. Please try again.");
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let text="";
  for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i);
   const content=await page.getTextContent({normalizeWhitespace:true});
   text += content.items.map(x=>x.str||"").join(" ")+"\n";
  }
  const clean=text.replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  const gst=(clean.match(/\b[0-9]{2}[A-Z0-9]{13}\b/)||[])[0]||"";
  const legal=(clean.match(/Legal Name\s+(.+?)(?=2\.?\s*Trade Name|Trade Name|3\.?\s*Additional trade|Additional trade|4\.?\s*Constitution|Constitution)/i)||[])[1]?.trim()||"";
  const trade=(clean.match(/Trade Name,?\s*if any\s+(.+?)(?=3\.?\s*Additional trade|Additional trade names|4\.?\s*Constitution|Constitution of Business)/i)||[])[1]?.trim()||"";
  const constitution=(clean.match(/Constitution of Business\s+(.+?)(?=5\.?\s*Address of Principal|Address of Principal Place of Business)/i)||[])[1]?.trim()||"";
  let address="";
  const ai=clean.search(/Address of Principal Place of Business/i);
  if(ai>=0){
   let tail=clean.slice(ai);
   tail=tail.split(/Date of Liability/i)[0];
   const labels=["Building No\.\/Flat No\.:?","Name Of Premises\/Building:?","Road\/Street:?","Nearby Landmark:?","Locality\/Sub Locality:?","City\/Town\/Village:?","District:?","State:?","PIN Code:?"];
   address=tail.replace(/Address of Principal Place of Business/i,"");
   for(const label of labels) address=address.replace(new RegExp(label,"ig")," ");
   address=address.replace(/\s{2,}/g," ").trim();
  }
  const pan=gst?gst.slice(2,12):"";
  if(trade) $("regName").value=trade; else if(legal) $("regName").value=legal;
  if(legal) $("regLegalName").value=legal;
  if(gst) $("regGstin").value=gst;
  if(pan) $("regPan").value=pan;
  if(constitution) $("regConstitution").value=constitution;
  if(address) $("regAddress").value=address;
  const found=[trade&&"Trade Name",legal&&"Legal Name",gst&&"GSTIN",constitution&&"Constitution",address&&"Address"].filter(Boolean);
  status.textContent=found.length?`Extracted ${found.join(", ")} from ${file.name}. Please verify before saving.`:"PDF text could not be identified. Please enter the details manually.";
 }catch(err){ console.error("GST extraction error:",err); status.textContent="Could not read this PDF. Please try the PDF again; if it is a scanned/image-only certificate, enter the details manually."; }
}

function findEwayNumber(text){
 const t=String(text||"").replace(/\s+/g," ");
 const labeled=[/(?:e[- ]?way\s*bill(?:\s*(?:no|number))?|eway\s*(?:no|number))\s*[:#-]?\s*(\d{12})/i,/(?:e[- ]?way\s*bill\s*(?:no|number))[^\d]{0,30}(\d{12})/i];
 for(const re of labeled){const m=t.match(re);if(m)return m[1];}
 const candidates=t.match(/\b\d{12}\b/g)||[];
 return candidates[0]||"";
}
async function extractEwayFromPDF(e){
 const file=e.target.files?.[0];if(!file)return;
 const status=$("ewayExtractStatus");if(status)status.textContent="Reading E-way Bill PDF and extracting the E-way Bill number…";
 try{
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let text="";
  for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
   const page=await pdf.getPage(pageNo);const content=await page.getTextContent({normalizeWhitespace:true});
   text+=" "+content.items.map(x=>x.str||"").join(" ");
  }
  const no=findEwayNumber(text);
  if(no){$("eway").value=no;if(status)status.textContent=`E-way Bill Number extracted automatically: ${no}`;}
  else if(status)status.innerHTML='<span class="danger-text">E-way Bill Number could not be extracted. Please enter it manually in the field above.</span>';
  // Keep the uploaded PDF in browser storage only; it is never sent to Supabase.
  window.__pendingEwayPdfFile=file;
 }catch(err){if(status)status.innerHTML='<span class="danger-text">Could not read this PDF. Please enter the E-way Bill number manually.</span>';}
}
async function saveEwayPdfForLoad(loadId,file){

  const db=await openEwayDb();
  await new Promise((resolve,reject)=>{const tx=db.transaction("ewayPdfs","readwrite");tx.objectStore("ewayPdfs").put({loadId,blob:file,name:file.name,type:file.type,updatedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
 }catch(e){console.warn("E-way PDF browser storage failed",e);}
}
function openEwayDb(){
 return new Promise((resolve,reject)=>{const req=indexedDB.open("WoodMasterLocal",1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("ewayPdfs"))db.createObjectStore("ewayPdfs",{keyPath:"loadId"});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
}
async function getEwayPdfForLoad(loadId){
 try{const db=await openEwayDb();return await new Promise((resolve,reject)=>{const tx=db.transaction("ewayPdfs","readonly");const r=tx.objectStore("ewayPdfs").get(loadId);r.onsuccess=()=>resolve(r.result?.blob||null);r.onerror=()=>reject(r.error);});}catch(e){return null;}

function poChanged(){
 const s=$("loadPO"), o=s.options[s.selectedIndex];
 if(!o||!o.value)return;
 const material=o.dataset.species||"";
 $("loadSpecies").value=material;
 $("ewayMaterial").value=material;
 $("loadCustomerGstin").value=o.dataset.gstin||"";
 $("loadHsn").value=o.dataset.hsn||"";
 $("loadWoodRate").value=o.dataset.rate||"";
 $("loadHandling").value=o.dataset.handling||"";
 $("loadAmc").value=o.dataset.amc||"";
 calcLoad();
}

function calcLoad(){
 const g=num($("grossWeight")?.value),t=num($("tareWeight")?.value),n=Math.max(0,g-t);
 if($("netWeight"))$("netWeight").value=n.toFixed(3);
 const wood=n*num($("loadWoodRate")?.value);
 const handlingBase=n*num($("loadHandling")?.value);
 const v1=wood;
 const v2=handlingBase*1.18;
 const v3=v1*1.18+v2;
 if($("ewayV1"))$("ewayV1").textContent=money(v1);
 if($("ewayV2"))$("ewayV2").textContent=money(v2);
 if($("ewayV3"))$("ewayV3").textContent=money(v3);
}

   <div class="field"><label>ITC Weighment Card / WC PDF or Image *</label><input id="itcFile" type="file" accept="application/pdf,image/*" onchange="extractITCWeighment(event)"></div>
   <div class="field"><label>Extraction Status</label><div id="itcStatus" class="readonly" style="padding:11px;border:1px solid #d6e0e8;border-radius:7px">Waiting for upload…</div></div>
  </div>
 </div>
 <div class="card">
  <h2>2. Verify ITC Weighment Details</h2>
  <div class="grid3">
   <div class="field"><label>WC Number *</label><input id="wcNumber"></div>
   <div class="field"><label>WC Date *</label><input id="wcDate" placeholder="dd-mm-yyyy"></div>
   <div class="field"><label>Vehicle Number *</label><input id="wcVehicle"></div>
   <div class="field"><label>DC Number</label><input id="wcDC" class="readonly" readonly></div>
   <div class="field"><label>DC Date</label><input id="wcDCDate" class="readonly" readonly></div>
   <div class="field"><label>Material Description</label><input id="wcMaterial"></div>
   <div class="field"><label>Gross Weight (MT)</label><input id="wcGross" type="number" step="0.001"></div>
   <div class="field"><label>Tare Weight (MT)</label><input id="wcTare" type="number" step="0.001"></div>
   <div class="field"><label>Net Weight (MT)</label><input id="wcNet" type="number" step="0.001"></div>
   <div class="field"><label>Approved Weight (MT) *</label><input id="wcApproved" type="number" step="0.001"></div>
  </div>
  <div class="actions">
   <button class="btn primary" onclick="saveITCWeighment()">Save ITC Weighment</button>
   <button class="btn secondary" onclick="go('loads')">Cancel</button>
  </div>
 </div>`;
}

function itcLoadChanged(){
 const id=$("itcLoad")?.value;
 if(!id)return;
 const opt=$("itcLoad").selectedOptions[0];
 const text=opt?.textContent||"";
 const parts=text.split(" — ");
 $("wcDC").value=parts[0]||"";
 $("wcVehicle").value=parts[1]||"";
 $("wcMaterial").value=parts[2]||"";
}


function formatDisplayDate(v){
 const s=String(v||"").slice(0,10);
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m?`${m[3]}-${m[2]}-${m[1]}`:s;
}
let pendingITCOCR = null;
let pendingITCExisting = null;

function normCompare(v){
 return String(v??"").trim().toUpperCase().replace(/\s+/g," ");
}
function compareValues(a,b,field){
 const aa=normCompare(a), bb=normCompare(b);
 if(!aa || !bb) return {match:false,unknown:true};
 if(["Gross Weight (MT)","Tare Weight (MT)","Net Weight (MT)","Approved Weight (MT)"].includes(field)){
   const x=Number(String(a).replace(/,/g,"")), y=Number(String(b).replace(/,/g,""));
   return {match:Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<0.001,unknown:false};
 }
 return {match:aa===bb,unknown:false};
}
function escAttr(v){return esc(String(v??"")).replace(/"/g,"&quot;");}

async function showITCComparison(ocr){
 const loadId=$("itcLoad")?.value;
 if(!loadId){alert("Select the Load / DC before uploading the ITC card.");return;}
 const {data:load,error}=await sb.from("loads")
  .select("id,dc_number,load_number,load_date,vehicle_id,po_id,network_gross,network_tare,network_net,species_name,vehicle_master(vehicle_number),po_master(po_number,species_name)")
  .eq("id",loadId).single();
 if(error){alert(error.message);return;}

 pendingITCOCR=ocr;
 pendingITCExisting=load;

 const existing={
  "DC Number":load.dc_number||load.load_number||"",
  "DC Date":load.load_date?formatDisplayDate(load.load_date):"",
  "Vehicle Number":load.vehicle_master?.vehicle_number||"",
  "Material":load.species_name||load.po_master?.species_name||"",
  "Gross Weight (MT)":load.network_gross??"",
  "Tare Weight (MT)":load.network_tare??"",
  "Net Weight (MT)":load.network_net??""
 };
 const card={
  "WC Number":ocr.wcNumber||"",
  "WC Date":ocr.wcDate||"",
  "DC Number":ocr.wcDC||"",
  "DC Date":ocr.wcDCDate||"",
  "Vehicle Number":ocr.wcVehicle||"",
  "Material":ocr.wcMaterial||"",
  "Gross Weight (MT)":ocr.wcGross||"",
  "Tare Weight (MT)":ocr.wcTare||"",
  "Net Weight (MT)":ocr.wcNet||"",
  "Approved Weight (MT)":ocr.wcApproved||""
 };
 const rows=[
  ["WC Number","",card["WC Number"],"card"],
  ["WC Date","",card["WC Date"],"card"],
  ["DC Number",existing["DC Number"],card["DC Number"],"compare"],
  ["DC Date",existing["DC Date"],card["DC Date"],"compare"],
  ["Vehicle Number",existing["Vehicle Number"],card["Vehicle Number"],"compare"],
  ["Material",existing["Material"],card["Material"],"compare"],
  ["Gross Weight (MT)",existing["Gross Weight (MT)"],card["Gross Weight (MT)"],"compare"],
  ["Tare Weight (MT)",existing["Tare Weight (MT)"],card["Tare Weight (MT)"],"compare"],
  ["Net Weight (MT)",existing["Net Weight (MT)"],card["Net Weight (MT)"],"compare"],
  ["Approved Weight (MT)","",card["Approved Weight (MT)"],"card"]
 ];
 $("itcCompareBody").innerHTML=rows.map(([field,oldVal,newVal,type])=>{
   const c=type==="compare"?compareValues(oldVal,newVal,field):{match:false,unknown:true};
   const cls=c.unknown?"":(c.match?"itc-match":"itc-mismatch");
   const badge=c.unknown?"":(c.match?'<span class="itc-badge match">MATCH</span>':'<span class="itc-badge diff">CHECK</span>');
   return `<tr>
    <td>${esc(field)}</td>
    <td class="itc-existing">${esc(oldVal||"—")}</td>
    <td><input id="cmp_${field.replace(/[^A-Za-z0-9]/g,"_")}" class="${cls} itc-card-val" value="${escAttr(newVal)}" style="width:100%"></td>
    <td>${badge}</td>
   </tr>`;
 }).join("");
 $("itcCompareModal").style.display="flex";
}

function cmpVal(field){
 const id="cmp_"+field.replace(/[^A-Za-z0-9]/g,"_");
 return $(id)?.value?.trim()||"";
}
function itcConfirmComparison(){
 const o={
  wcNumber:cmpVal("WC Number"),
  wcDate:cmpVal("WC Date"),
  wcDC:cmpVal("DC Number"),
  wcDCDate:cmpVal("DC Date"),
  wcVehicle:cmpVal("Vehicle Number"),
  wcMaterial:cmpVal("Material"),
  wcGross:cmpVal("Gross Weight (MT)"),

 };

 $("wcVehicle").value=o.wcVehicle || pendingITCExisting?.vehicle_master?.vehicle_number || "";
 $("wcMaterial").value=o.wcMaterial || pendingITCExisting?.po_master?.species_name || "";
 $("wcGross").value=o.wcGross;
 $("wcTare").value=o.wcTare;
 $("wcNet").value=o.wcNet;

 $("itcStatus").textContent="ITC card values confirmed. Review the form below, then save.";
 $("itcCompareModal").style.display="none";

}
function itcManualEntry(){
 $("itcCompareModal").style.display="none";
 ["wcNumber","wcDate","wcDCDate","wcMaterial","wcGross","wcTare","wcNet","wcApproved"].forEach(id=>{if($(id))$(id).value="";});
 if(pendingITCExisting){
  $("wcDC").value=pendingITCExisting.dc_number||"";
  $("wcVehicle").value=pendingITCExisting.vehicle_master?.vehicle_number||"";
 }
 $("itcStatus").textContent="Manual entry selected. Enter/verify the ITC weighment details below.";
 $("wcNumber").focus();
}

async function extractITCWeighment(e){
 const file=e.target.files?.[0]; if(!file)return;
 const status=$("itcStatus"); status.textContent="Reading ITC weighment card…";
 try{
  let text="";
  if(file.type==="application/pdf"){
   if(!window.pdfjsLib)throw new Error("PDF reader is loading.");
   const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
   for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent({normalizeWhitespace:true});
    text+=tc.items.map(x=>x.str).join(" ")+" ";
   }
  }else{
   // OCR the original image plus an enhanced copy. ITC cards are often
   // low-contrast WhatsApp photographs, so one OCR pass is not reliable.
   const original=await Tesseract.recognize(file,"eng",{
    logger:m=>{if(m.status==="recognizing text")status.textContent=`OCR ${Math.round((m.progress||0)*100)}%…`;}
   });
   text=original.data.text||"";

   const enhanced=await enhanceITCImage(file);
   const second=await Tesseract.recognize(enhanced,"eng",{
    logger:m=>{if(m.status==="recognizing text")status.textContent=`OCR enhanced image ${Math.round((m.progress||0)*100)}%…`;}
   });
   text+="\n"+(second.data.text||"");

   // A focused OCR pass on the bottom weight row improves Gross/Tare/Net/Approved.
   const weightCrop=await cropITCImage(file,0.08,0.56,0.92,0.72);
   const wr=await Tesseract.recognize(weightCrop,"eng",{config:{tessedit_pageseg_mode:"6"}});
   text+="\n"+(wr.data.text||"");
  }

  parseITCText(text);
  const ocr={
   wcNumber:$("wcNumber")?.value||"",
   wcDate:$("wcDate")?.value||"",
   wcVehicle:$("wcVehicle")?.value||"",
   wcDC:$("wcDC")?.value||"",
   wcDCDate:$("wcDCDate")?.value||"",
   wcMaterial:$("wcMaterial")?.value||"",
   wcGross:$("wcGross")?.value||"",
   wcTare:$("wcTare")?.value||"",
   wcNet:$("wcNet")?.value||"",
   wcApproved:$("wcApproved")?.value||""
  };
  const filled=Object.values(ocr).filter(Boolean).length;
  status.textContent=`Extraction complete (${filled}/10 fields found). Opening comparison…`;
  await showITCComparison(ocr);
 }catch(err){
  console.error("ITC extraction error:",err);
  status.textContent="Could not extract automatically. Please verify/enter the fields manually.";
 }
}

async function enhanceITCImage(file){
 const bmp=await createImageBitmap(file);
 const scale=2;
 const c=document.createElement("canvas");
 c.width=bmp.width*scale; c.height=bmp.height*scale;
 const ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(bmp,0,0,c.width,c.height);
 const d=ctx.getImageData(0,0,c.width,c.height);
 for(let i=0;i<d.data.length;i+=4){
   const g=(0.299*d.data[i])+(0.587*d.data[i+1])+(0.114*d.data[i+2]);
   const v=g<175?0:255;
   d.data[i]=d.data[i+1]=d.data[i+2]=v;
 }
 ctx.putImageData(d,0,0);
 return await new Promise(resolve=>c.toBlob(resolve,"image/png"));
}

async function cropITCImage(file,x1,y1,x2,y2){
 const bmp=await createImageBitmap(file);
 const c=document.createElement("canvas");
 const sx=Math.round(bmp.width*x1), sy=Math.round(bmp.height*y1);
 const sw=Math.round(bmp.width*(x2-x1)), sh=Math.round(bmp.height*(y2-y1));
 c.width=sw*3; c.height=sh*3;
 const ctx=c.getContext("2d");
 ctx.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
 return await new Promise(resolve=>c.toBlob(resolve,"image/png"));
}

function normalizeITCText(text){
 return String(text||"")
  .replace(/[|]/g," ")
  .replace(/[“”]/g,'"')
  .replace(/[’]/g,"'")
  .replace(/\r/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function cleanITCNumber(v){
 return String(v||"").replace(/[^0-9.]/g,"");
}

function cleanITCDate(v){
 const s=String(v||"").replace(/[./]/g,"-").replace(/\s+/g,"").trim();
 const m=s.match(/(\d{2})-(\d{2})-(\d{4})/);
 return m ? `${m[1]}-${m[2]}-${m[3]}` : "";
}

function parseITCText(text){
 const t=normalizeITCText(text);

 // Do NOT use a generic "Date" pattern: this card contains Security No Date,
 // Weighment Card Date and DC Date.
 const wc =
   findITC(t,[
    /Weighment\s*Card\s*(?:No|Number)\s*[:\-]?\s*([A-Z0-9\/-]{8,})/i,
    /Weighment\s*Card\s*No\.?\s*([A-Z0-9\/-]{8,})/i,
    /(?:WC|Weight\s*Card)\s*(?:No|Number)\s*[:\-]?\s*([A-Z0-9\/-]{8,})/i
   ]) || "";

 const wcDateRaw=findITC(t,[
   /Weighment\s*Card\s*Date\s*[:\-]?\s*(\d{2}[./-]\d{2}[./-]\d{4})/i
 ]);
 const dcDateRaw=findITC(t,[
   /DC\s*Date\s*[:\-]?\s*(\d{2}[./-]\d{2}[./-]\d{4})/i
 ]);

 const vehicle =
   findITC(t,[
    /Vehicle\s*(?:No|Number)\s*[:\-]?\s*([A-Z0-9-]{8,})/i,
    /Vehicle\s*No\.?\s*([A-Z0-9-]{8,})/i
   ]) || "";

 const dc =
   findITC(t,[
    /DC\s*(?:No|Number)\s*[:\-]?\s*(\d{1,8})/i,
    /DC\s*No\.?\s*(\d{1,8})/i
   ]) || "";

 const material =
   findITC(t,[
    /Material\s*Description\s*[:\-]?\s*(EUCALYPTUS\s+DEBARKED\s+WOOD[^|;]*?)(?=\s+UOM\b|\s+P\.?\s*O\b|\s+PO\s+No\b|$)/i,
    /(EUCALYPTUS\s+DEBARKED\s+WOOD)/i
   ]) || "";

 // Weight-row extraction: prefer the four values that appear together near
 // Gross WT / Tare WT / Net WT / Approved WT.
 let gross="",tare="",net="",approved="";
 const weightRow=t.match(
   /Gross\s*WT\s+([0-9.,]+)\s+Tare\s*WT\s+([0-9.,]+)\s+Net\s*WT\s+([0-9.,]+)\s+Approved\s*WT\s+([0-9.,]+)/i
 );
 if(weightRow){
   gross=cleanITCNumber(weightRow[1]);
   tare=cleanITCNumber(weightRow[2]);
   net=cleanITCNumber(weightRow[3]);
   approved=cleanITCNumber(weightRow[4]);
 }

 // Fallbacks for OCR where labels and values are separated.
 if(!gross) gross=findITC(t,[/Gross\s*WT[^0-9]{0,30}([0-9]{2,3}[.,][0-9]{3})/i,/Gross\s*Weight[^0-9]{0,30}([0-9.,]+)/i]);
 if(!tare) tare=findITC(t,[/Tare\s*WT[^0-9]{0,30}([0-9]{1,3}[.,][0-9]{3})/i,/Tare\s*Weight[^0-9]{0,30}([0-9.,]+)/i]);
 if(!net) net=findITC(t,[/Net\s*WT[^0-9]{0,30}([0-9]{1,3}[.,][0-9]{3})/i,/Net\s*Weight[^0-9]{0,30}([0-9.,]+)/i]);
 if(!approved) approved=findITC(t,[/Approved\s*WT[^0-9]{0,30}([0-9]{1,3}[.,][0-9]{3})/i,/Approved\s*Weight[^0-9]{0,30}([0-9.,]+)/i]);

 if(wc) $("wcNumber").value=wc;
 if(wcDateRaw) $("wcDate").value=cleanITCDate(wcDateRaw);
 if(vehicle) $("wcVehicle").value=vehicle.replace(/\s+/g,"").toUpperCase();
 if(dc) $("wcDC").value=dc;
 if(dcDateRaw) $("wcDCDate").value=cleanITCDate(dcDateRaw);
 if(material) $("wcMaterial").value=material.trim().toUpperCase();
 if(gross) $("wcGross").value=gross;
 if(tare) $("wcTare").value=tare;
 if(net) $("wcNet").value=net;
 if(approved) $("wcApproved").value=approved;

 // If OCR missed net/approved but the other values are clear, calculate only
 // as a fallback; the user can still verify the printed values before saving.
 if(!$("wcNet").value && gross && tare){
   const n=Number(gross)-Number(tare);
   if(n>0)$("wcNet").value=n.toFixed(3);
 }
 if(!$("wcApproved").value && $("wcNet").value){
   $("wcApproved").value=$("wcNet").value;
 }
}
async function saveITCWeighment(){
 const loadId=$("itcLoad").value,wc=$("wcNumber").value.trim();
 if(!loadId||!wc){alert("Select Load/DC and enter WC Number.");return;}
 const dup=await sb.from("itc_weighments").select("id").eq("wc_number",wc).limit(1);
 if(dup.error){alert(dup.error.message);return;}
 if(dup.data?.length){alert("This WC Number already exists.");return;}
 const row={
  load_id:loadId,
  wc_number:wc,
  wc_date:toISODate($("wcDate").value),
  vehicle_number:$("wcVehicle").value.trim(),
  dc_number:$("wcDC").value.trim(),
  material_description:$("wcMaterial").value.trim(),
  gross_weight:Number($("wcGross").value)||null,
  tare_weight:Number($("wcTare").value)||null,
  net_weight:Number($("wcNet").value)||null,
  approved_weight:Number($("wcApproved").value)||null
 };
 const {error}=await sb.from("itc_weighments").insert(row);
 if(error){alert(error.message);return;}
 alert("ITC Weighment saved successfully.");
 go("loads");
}

async function render(){
 const app=$("app");
 if(!state.session){
  app.innerHTML=`<div class="login"><div class="loginbox"><h1>🌲 WoodMaster</h1><div class="sub">Wood Supply, Load, ITC Weighment and Billing Management</div>
   <div class="field"><label>Email</label><input id="email" type="email" placeholder="Email" autocomplete="username"></div>
   <div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password"></div>
   <div class="actions"><button class="btn primary" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button></div>
   <div id="authmsg"></div>
  </div></div>`;
  return;
 }
 try{
  if(state.page==="registration"){app.innerHTML=shell(registrationPage(false));return;}
  if(state.page==="contractors"){app.innerHTML=shell(await contractorSelection());return;}
  let body="";
  if(state.page==="dashboard")body=await dashboard();
  else if(state.page==="loads")body=await loadsPage();
  else if(state.page==="newload")body=await newLoad();
  else if(state.page==="itcWeighment")body=await renderITCWeighment();
  else if(state.page==="loaddetail"){window.__loadDetailId=window.__loadDetailId||null;body=loadDetailsPage();}
  else if(state.page==="masters")body=await masters();
  else body=await dashboard();
  app.innerHTML=shell(body);
  if(state.page==="newload" && state.editingLoadId) await initEditLoadForm();
  if(state.page==="masters"){
   const d=$("defaultCustomer");
   if(d)d.value=activeContractor()?.default_customer_id||"";
   const m=$("mCustomer");
   if(m)m.value=activeContractor()?.default_customer_id||"";
  }
 }catch(err){
  app.innerHTML=shell(`<h1>Error</h1><div class="notice error">${esc(err.message||err)}</div><button class="btn secondary" onclick="go('contractors')">Return to Contractors</button>`);
 }
}

async function login(){
 const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){$("authmsg").innerHTML=`<div class="notice error">${esc(error.message)}</div>`;return;}
 state.page="contractors";state.selectedContractor=null;
}
async function signup(){
 const email=$("email").value.trim(),password=$("password").value;
 const {error}=await sb.auth.signUp({email,password});
 $("authmsg").innerHTML=`<div class="notice ${error?"error":"success"}">${esc(error?error.message:"Account created. Check your email if email confirmation is enabled.")}</div>`;
}
function showRegistration(){state.page="registration";render();}
function changeContractor(){state.selectedContractor=null;state.page="contractors";render();}
async function logout(){await sb.auth.signOut();state.selectedContractor=null;state.page="contractors";}
async function go(p){if(p!=="contractors"&&!activeContractor()){state.page="contractors";return render();}state.page=p;await render();}

sb.auth.onAuthStateChange((_event,session)=>{state.session=session; if(!session){state.selectedContractor=null;state.page="contractors";} render();});
sb.auth.getSession().then(({data})=>{state.session=data.session;if(!state.session)state.page="contractors";render();});
</script>
